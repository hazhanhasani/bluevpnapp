name: BlueVPN Release 5.10.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-51009.yml'
      - 'scripts/release_51009.py'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Apply Windows Tapsell fix and sync 5.10.9
        run: python scripts/release_51009.py

      - name: Commit synchronized product update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          git add -A ':!.github/workflows'
          git commit -m "release: BlueVPN 5.10.9 Windows Tapsell transition fix"
          git push origin HEAD:main

      - name: Dispatch coordinated 5.10.9 release
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "Dispatching BlueVPN 5.10.9 from $SOURCE_SHA"

          gh workflow run bluevpn-manager-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_sha="$SOURCE_SHA" -f request_id="version-5.10.9-${GITHUB_RUN_ID}"

          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type='bluevpn_build' -F 'client_payload[ref]'='main' -F 'client_payload[target_sha]'="$SOURCE_SHA" -F 'client_payload[build_mode]'='full'

          gh workflow run build-windows.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_sha="$SOURCE_SHA"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_sha="$SOURCE_SHA"
          gh workflow run bluevpn-site-theme-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_sha="$SOURCE_SHA"
