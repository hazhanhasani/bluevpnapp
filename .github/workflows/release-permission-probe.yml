name: BlueVPN Release Permission Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-permission-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Probe temporary tag creation
        shell: bash
        run: |
          set -euo pipefail
          TAG="bluevpn-ci-probe-${GITHUB_RUN_ID}"
          git config user.name "bluevpn-ci-probe"
          git config user.email "bluevpn-ci-probe@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          git push origin ":refs/tags/$TAG"
          echo "TAG_PROBE=PASS"

      - name: Probe temporary draft release creation
        shell: bash
        run: |
          set -euo pipefail
          TAG="bluevpn-release-probe-${GITHUB_RUN_ID}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BlueVPN release permission probe" --draft
          echo "RELEASE_PROBE=PASS"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

      - name: Remove probe workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bluevpn-ci-probe"
          git config user.email "bluevpn-ci-probe@users.noreply.github.com"
          git pull --ff-only origin main
          rm -f .github/workflows/release-permission-probe.yml
          git add .github/workflows/release-permission-probe.yml
          git commit -m "chore(ci): remove release permission probe [skip ci]"
          git push origin HEAD:main
