name: BlueVPN Windows 5.0.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: bluevpn-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 5.0.2
  WINDOWS_CHANNEL: beta
  DOTNET_VERSION: '10.0.x'
  RUNTIME_REPOSITORY: 2dust/v2rayN
  V2RAYN_VERSION: '7.24.4'
  AETHER_VERSION: 'v1.1.1'

jobs:
  build-windows:
    name: Build BlueVPN Windows 5.0.2 (${{ matrix.rid }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runtime_asset: v2rayN-windows-64.zip
            warp_asset: aether-windows-x86_64.zip
          - rid: win-arm64
            runtime_asset: v2rayN-windows-arm64.zip
            warp_asset: ARM64-FALLBACK.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show build identity
        shell: pwsh
        run: |
          Write-Host "BlueVPN version: $env:VERSION"
          Write-Host "Git ref: $env:GITHUB_REF"
          dotnet --info

      - name: Validate pinned runtime references
        shell: pwsh
        run: |
          if (-not (Test-Path 'third_party/V2RAYN.md')) { throw 'Missing third_party/V2RAYN.md' }
          if (-not (Test-Path 'third_party/XRAY_WINDOWS.md')) { throw 'Missing third_party/XRAY_WINDOWS.md' }
          Get-Content third_party/V2RAYN.md
          Get-Content third_party/XRAY_WINDOWS.md
          Write-Host "V2RAYN_VERSION: $env:V2RAYN_VERSION"
          Write-Host "AETHER_VERSION: $env:AETHER_VERSION"

      - name: Restore
        run: dotnet restore bluevpn-windows/BlueVPN.Windows.csproj

      - name: Build
        run: dotnet build bluevpn-windows/BlueVPN.Windows.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish bluevpn-windows/BlueVPN.Windows.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output dist/${{ matrix.rid }}

      - name: Validate published executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\${{ matrix.rid }}\BlueVPN.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $version = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "BlueVPN.exe FileVersion: $version"
          if ($version -notmatch '^5\.0\.2\.0$') {
            throw "Unexpected file version: $version"
          }

      - name: Smoke check runtime configs
        shell: pwsh
        run: |
          $configs = @(
            'bluevpn-windows/runtime-config/xray-local-proxy-smoke.json',
            'bluevpn-windows/runtime-config/singbox-v2rayn-tun-smoke.json',
            'bluevpn-windows/runtime-config/singbox-warp-smoke.json'
          )
          foreach ($config in $configs) {
            if (-not (Test-Path $config)) { throw "Missing runtime config: $config" }
            Get-Content $config | ConvertFrom-Json | Out-Null
            Write-Host "Valid JSON: $config"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.4.3 --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc "/DMyVersion=$env:VERSION" "/DMyRid=${{ matrix.rid }}" "/DPublishDir=$PWD\dist\${{ matrix.rid }}" 'bluevpn-windows/installer/BlueVPN.iss'

          $installer = "dist\installers\BlueVPN-Setup-$env:VERSION-${{ matrix.rid }}.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          Get-FileHash $installer -Algorithm SHA256

      - name: Sign release installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw 'Windows signing secrets are required for tagged releases.'
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'bluevpn-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_B64))
          $installer = "dist\installers\BlueVPN-Setup-$env:VERSION-${{ matrix.rid }}.exe"

          $signtool = Get-Command signtool.exe -ErrorAction Stop
          & $signtool.Path sign /fd SHA256 /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD /tr 'http://timestamp.digicert.com' /td SHA256 $installer
          & $signtool.Path verify /pa /all $installer
          Remove-Item $pfx -Force

      - name: Verify installer on release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installer = "dist\installers\BlueVPN-Setup-$env:VERSION-${{ matrix.rid }}.exe"
          $sig = Get-AuthenticodeSignature $installer
          Write-Host "Authenticode status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw "Installer Authenticode signature is not valid on release build." }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueVPN-Windows-${{ matrix.rid }}-${{ env.VERSION }}
          path: dist/installers/BlueVPN-Setup-${{ env.VERSION }}-${{ matrix.rid }}.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish BlueVPN Windows 5.0.2 release
    if: startsWith(github.ref, 'refs/tags/v') && github.ref_name == 'v5.0.2'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: 5.0.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist/installers
          pattern: BlueVPN-Windows-*-${{ env.VERSION }}
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/installers/*.exe)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected exactly 2 Windows installers, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          sha256sum "${files[@]}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${VERSION}" \
            dist/installers/BlueVPN-Setup-${VERSION}-win-x64.exe \
            dist/installers/BlueVPN-Setup-${VERSION}-win-arm64.exe \
            --title "BlueVPN Windows ${VERSION}" \
            --prerelease \
            --generate-notes

      - name: Sync release metadata to WordPress
        env:
          BLUEVPN_RELEASE_SYNC_SECRET: ${{ secrets.BLUEVPN_RELEASE_SYNC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BLUEVPN_RELEASE_SYNC_SECRET:-}" ]; then
            echo 'BLUEVPN_RELEASE_SYNC_SECRET is not configured; skipping WordPress sync.'
            exit 0
          fi

          signature=$(printf '%s' "${VERSION}:${BLUEVPN_RELEASE_SYNC_SECRET}" | sha256sum | cut -d' ' -f1)
          curl --fail-with-body --retry 4 --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${BLUEVPN_RELEASE_SYNC_SECRET}" \
            -H "X-BlueVPN-Release-Signature: ${signature}" \
            --data "version=${VERSION}&channel=beta&tag=v${VERSION}" \
            'https://bot.blluepanel.ir/wp-json/bluevpn/v1/windows/release-sync'
