# Retry trigger after Shahrah repair contract update
name: BlueVPN Apply 6.3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-60301.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluevpn-apply-60301
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current BlueVPN source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Bump canonical version contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("version.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["version"]="6.3.1"
          d["version_code"]=60301
          for key in list((d.get("components") or {}).keys()):
              d["components"][key]="6.3.1"
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python scripts/sync_version.py

      - name: Register 6.3.1 manager hotfix metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          release=Path("release.json")
          data=json.loads(release.read_text(encoding="utf-8"))
          features=list(data.get("features") or [])
          for feature in [
              "blueai-db-write-fail-fast",
              "blueai-five-minute-ops-loop",
              "blueai-reconcile-rotating-cursor",
              "database-schema-drift-self-heal",
              "database-critical-column-health",
              "blueai-readiness-dashboard",
          ]:
              if feature not in features:
                  features.append(feature)
          data["features"]=features
          release.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          readme=Path("bluevpn-manager/readme.txt")
          text=readme.read_text(encoding="utf-8")
          marker="Requires PHP: 8.0\n"
          entry="""\n== 6.3.1 ==\n* BlueAI دیگر خطاهای نوشتن MySQL را موفق گزارش نمی‌کند و برای Event/Aggregate/Feedback به‌صورت Fail-fast عمل می‌کند.\n* Database Health علاوه بر وجود جدول‌ها، ستون‌های حیاتی Schema را کنترل و Drift را هر ۵ دقیقه Self-heal می‌کند.\n* BlueAI Operations هر ۵ دقیقه اجرا می‌شود، Cursor چرخشی دارد و کاربران انتهای لیست را هم بدون Starvation بررسی می‌کند.\n* پنل BlueAI وضعیت دیتابیس، Scheduler و آمادگی واقعی داده‌های یادگیری را نشان می‌دهد.\n"""
          if "== 6.3.1 ==" not in text:
              text=text.replace(marker,marker+entry,1)
              readme.write_text(text,encoding="utf-8")
          PY
          printf '%s\n' 'BlueVPN 6.3.1 coordinated build: BlueAI and database resilience hardening' > release-requests/all-build-6.3.1-blueai-db-resilience.txt

      - name: Validate synchronized 6.3.1 source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python scripts/sync_version.py --check
          python scripts/validate_release.py
          python scripts/validate_windows.py
          python scripts/validate_php_release.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit coordinated 6.3.1 release and build request
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          git add -A ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "BlueVPN 6.3.1 is already synchronized."
            exit 0
          fi
          git commit -m "release: BlueVPN 6.3.1 BlueAI database resilience"
          git push origin HEAD:main
