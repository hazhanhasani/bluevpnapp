# Retry trigger after Shahrah repair contract update
name: BlueVPN Apply 6.3.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-60302.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluevpn-apply-60302
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current BlueVPN source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Bump canonical version contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("version.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["version"]="6.3.2"
          d["version_code"]=60302
          for key in list((d.get("components") or {}).keys()):
              d["components"][key]="6.3.2"
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python scripts/sync_version.py

      - name: Register 6.3.2 manager hotfix metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          release=Path("release.json")
          data=json.loads(release.read_text(encoding="utf-8"))
          features=list(data.get("features") or [])
          for feature in [
              "android-update-first-party-streaming-relay",
              "android-update-default-route-vpn-first",
              "android-update-physical-network-fallback",
              "android-update-github-release-relay",
              "android-update-legacy-client-server-hotfix",
          ]:
              if feature not in features:
                  features.append(feature)
          data["features"]=features
          release.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          readme=Path("bluevpn-manager/readme.txt")
          text=readme.read_text(encoding="utf-8")
          marker="Requires PHP: 8.0\n"
          entry="""\n== 6.3.2 ==\n* دانلود بروزرسانی Android از GitHub دیگر مستقیماً به اینترنت فیزیکی کاربر وابسته نیست؛ Manager یک Relay باینری First-party ارائه می‌دهد.\n* کلاینت ابتدا Default Route اندروید را استفاده می‌کند تا VPN فعال واقعاً در دانلود بروزرسانی مؤثر باشد و فقط در صورت شکست به شبکه فیزیکی برود.\n* لینک‌های APK در mobile/config برای کلاینت‌های قدیمی نیز به Relay دامنه BlueVPN بازنویسی می‌شوند؛ بنابراین کاربران 6.2.x/6.3.1 بدون نصب اولیه نسخه جدید هم از مسیر جدید استفاده می‌کنند.\n"""
          if "== 6.3.2 ==" not in text:
              text=text.replace(marker,marker+entry,1)
              readme.write_text(text,encoding="utf-8")
          PY
          printf '%s\n' 'BlueVPN 6.3.2 coordinated build: Android update relay and route fix' > release-requests/all-build-6.3.2-android-update-relay.txt

      - name: Validate synchronized 6.3.2 source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python scripts/sync_version.py --check
          python scripts/validate_release.py
          python scripts/validate_windows.py
          python scripts/validate_php_release.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit coordinated 6.3.2 release and build request
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          git add -A ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "BlueVPN 6.3.2 is already synchronized."
            exit 0
          fi
          git commit -m "release: BlueVPN 6.3.2 Android update relay"
          git push origin HEAD:main
