name: Build Signed BlueVPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout BlueVPN project
        uses: actions/checkout@v4

      - name: Check permanent signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Read branding configuration
        id: config
        shell: bash
        run: |
          echo "upstream_ref=$(python -c 'import json; print(json.load(open("branding/app.json"))["upstream_ref"])')" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c 'import json; print(json.load(open("branding/app.json"))["version_name"])')" >> "$GITHUB_OUTPUT"

      - name: Checkout official v2rayNG source
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: ${{ steps.config.outputs.upstream_ref }}
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          python - <<'PY'
          from pathlib import Path

          path = Path("upstream/V2rayNG/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          marker = "android {"

          if 'ndkVersion = "29.0.14206865"' not in text:
              if marker not in text:
                  raise SystemExit("android block not found")
              text = text.replace(
                  marker,
                  marker + '\n    ndkVersion = "29.0.14206865"',
                  1,
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Build libhevtun
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Fetch AndroidLibXrayLite release tag
        id: xray
        working-directory: upstream/AndroidLibXrayLite
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            --force \
            --prune \
            --tags \
            "+refs/tags/*:refs/tags/*"

          CURRENT_TAG="$(git tag --points-at HEAD | sort -V | tail -n 1)"
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG="$(git describe --tags --abbrev=0)"
          fi
          if [ -z "$CURRENT_TAG" ]; then
            echo "Could not determine AndroidLibXrayLite release tag."
            exit 1
          fi

          echo "AndroidLibXrayLite commit: $(git rev-parse --short HEAD)"
          echo "AndroidLibXrayLite tag: $CURRENT_TAG"
          echo "tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ steps.xray.outputs.tag }}
          fileName: libv2ray.aar
          out-file-path: upstream/V2rayNG/app/libs/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install branding tools
        run: pip install pillow

      - name: Apply BlueVPN custom UI and features
        run: python scripts/prepare_android.py

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: upstream/V2rayNG/**/*.gradle*

      - name: Build unsigned release APKs
        working-directory: upstream/V2rayNG
        shell: bash
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          ./gradlew :app:assemblePlaystoreRelease \
            "-PABI_FILTERS=arm64-v8a;armeabi-v7a" \
            --stacktrace \
            --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Show Android compiler errors
        if: failure()
        shell: bash
        run: |
          echo "========== Android build errors =========="
          if [ -f android-build.log ]; then
            grep -E -i               "e: |error:|unresolved reference|cannot access|compilation error|failed"               android-build.log               | tail -n 120               || tail -n 160 android-build.log
          else
            echo "android-build.log was not created."
          fi

      - name: Upload failed Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BlueVPN-android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Decode permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bluevpn-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/bluevpn-signing/BlueVPN-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/bluevpn-signing/BlueVPN-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

      - name: Align and sign APKs permanently
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          KEYSTORE="$RUNNER_TEMP/bluevpn-signing/BlueVPN-release.jks"
          mkdir -p dist "$RUNNER_TEMP/bluevpn-aligned"

          mapfile -t APKS < <(
            find upstream/V2rayNG/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No release APK was generated."
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            filename="$(basename "$apk")"
            clean_name="${filename%-unsigned.apk}.apk"
            clean_name="${clean_name/BlueVPN_/BlueVPN_}"
            aligned="$RUNNER_TEMP/bluevpn-aligned/${clean_name%.apk}-aligned.apk"
            signed="dist/$clean_name"

            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "$aligned"

            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$signed" \
              "$aligned"

            "$BUILD_TOOLS/apksigner" verify \
              --verbose \
              --print-certs \
              "$signed"

            echo "Signed: $signed"
          done

          echo "Generated signed APKs:"
          ls -lah dist

      - name: Create SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload signed BlueVPN APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueVPN-${{ steps.config.outputs.version }}-signed
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Send signed APK files to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.config.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not configured; skipping Telegram delivery."
            exit 0
          fi

          for apk in dist/*.apk; do
            CAPTION="$(printf '✅ BlueVPN %s\n📦 %s\n🔐 امضای دائمی فعال است؛ بروزرسانی‌های بعدی بدون حذف برنامه نصب می‌شوند.' \
              "$VERSION" "$(basename "$apk")")"

            curl --fail --show-error --silent \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              --form "chat_id=${TELEGRAM_CHAT_ID}" \
              --form "document=@${apk}" \
              --form-string "caption=${CAPTION}"
          done
