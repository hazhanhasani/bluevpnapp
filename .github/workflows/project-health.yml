name: BlueVPN Manager Release Discovery Repair

on:
  push:
    branches:
      - automation/manager-release-discovery-repair

permissions:
  contents: write

jobs:
  build-validated-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Apply Manager release discovery repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          updater = Path('bluevpn-manager/includes/class-bluevpn-github-updater.php')
          s = updater.read_text(encoding='utf-8')
          helper = "    /**\n     * Resolve the newest stable Manager release through tag refs, then fetch\n     * that release by its exact tag. GitHub's releases collection can lag\n     * behind a just-published component release even while the tag-specific\n     * endpoint is already consistent.\n     *\n     * @return array|WP_Error|null\n     */\n    private static function latest_release_from_refs() {\n        $s = self::settings();\n        $prefix = (string)$s['tag_prefix'];\n        $url = 'https://api.github.com/repos/' . rawurlencode((string)$s['owner']) . '/' . rawurlencode((string)$s['repo']) . '/git/matching-refs/tags/' . rawurlencode($prefix);\n        $response = wp_remote_get($url, [\n            'timeout' => 12,\n            'redirection' => 3,\n            'headers' => self::request_headers(false),\n        ]);\n        if (is_wp_error($response)) return $response;\n\n        $status = (int)wp_remote_retrieve_response_code($response);\n        if ($status !== 200) {\n            return new WP_Error('bluevpn_github_refs_http', 'GitHub Manager tag refs HTTP ' . $status);\n        }\n\n        $refs = json_decode(wp_remote_retrieve_body($response), true);\n        if (!is_array($refs)) {\n            return new WP_Error('bluevpn_github_refs_json', 'پاسخ GitHub Manager tag refs معتبر نیست.');\n        }\n\n        $refPrefix = 'refs/tags/' . $prefix;\n        $versions = [];\n        foreach ($refs as $row) {\n            if (!is_array($row)) continue;\n            $ref = (string)($row['ref'] ?? '');\n            if ($ref === '' || strpos($ref, $refPrefix) !== 0) continue;\n            $version = substr($ref, strlen($refPrefix));\n            if (!preg_match('/^\\d+\\.\\d+\\.\\d+$/', $version)) continue;\n            $versions[$version] = true;\n        }\n        if (!$versions) return null;\n\n        $versions = array_keys($versions);\n        usort($versions, static fn($a, $b) => version_compare($b, $a));\n\n        // A tag can exist moments before its Release object is published.\n        // Walk only a bounded set of newest tags and confirm each through the\n        // exact Release endpoint, which also validates the expected ZIP asset.\n        foreach (array_slice($versions, 0, 12) as $version) {\n            $release = self::release_by_version((string)$version, 1);\n            if (is_array($release)) return $release;\n            if (is_wp_error($release)) return $release;\n        }\n        return null;\n    }\n\n"
          signature = '    public static function latest_release(bool $force = false) {'
          sig_at = s.index(signature)
          doc_at = s.rfind('    /**', 0, sig_at)
          if doc_at < 0:
              raise SystemExit('latest_release doc marker not found')
          s = s[:doc_at] + helper + s[doc_at:]

          sig_at = s.index(signature)
          tail_start = s.index('        if (!$candidates) {', sig_at)
          normalize_at = s.index('    private static function normalize_exact_release', tail_start)
          old_return = '        return $latest;\n'
          tail_end = s.rfind(old_return, tail_start, normalize_at)
          if tail_end < 0:
              raise SystemExit('latest_release tail return not found')
          tail_end += len(old_return)
          new_tail = "        $latest = null;\n        if ($candidates) {\n            usort($candidates, static fn($a, $b) => version_compare($b['version'], $a['version']));\n            $latest = $candidates[0];\n            $latest['version'] = self::effective_version($latest);\n        }\n\n        // Do not spend extra GitHub requests while the releases collection is\n        // already advertising a semantic update. If it has no Manager entry,\n        // or only reports the installed/older version, verify the newest tag\n        // through matching refs + the exact Release endpoint. This recovers\n        // from GitHub collection lag without turning every poll into 3 calls.\n        $needsRefFallback = !is_array($latest)\n            || version_compare(self::base_version($latest), BLUEVPN_MANAGER_VERSION, '<=');\n        if ($needsRefFallback) {\n            $fallback = self::latest_release_from_refs();\n            if (is_array($fallback)) {\n                if (!is_array($latest) || version_compare(self::base_version($fallback), self::base_version($latest), '>=')) {\n                    $latest = $fallback;\n                }\n            } elseif (is_wp_error($fallback) && !is_array($latest)) {\n                return $fallback;\n            }\n        }\n\n        if (!is_array($latest)) {\n            set_site_transient(self::CACHE_KEY, 'none', self::CACHE_TTL);\n            return null;\n        }\n\n        set_site_transient(self::CACHE_KEY, $latest, self::CACHE_TTL);\n        return $latest;\n"
          s = s[:tail_start] + new_tail + s[tail_end:]
          updater.write_text(s, encoding='utf-8')

          test_file = Path('tests/test_deploy_manager_source_fallback_4170.py')
          t = test_file.read_text(encoding='utf-8')
          marker = '    def test_project_root_accepts_wrappers_and_normalizes_versioned_manager_folder(self):\n'
          regression = '    def test_manager_release_collection_lag_falls_back_to_tag_refs(self):\n        updater = text(\'bluevpn-manager/includes/class-bluevpn-github-updater.php\')\n        self.assertIn(\'private static function latest_release_from_refs\', updater)\n        self.assertIn(\'/git/matching-refs/tags/\', updater)\n        self.assertIn(\'release_by_version((string)$version, 1)\', updater)\n        self.assertIn(\'$needsRefFallback\', updater)\n        self.assertIn("version_compare(self::base_version($latest), BLUEVPN_MANAGER_VERSION, \'<=\')", updater)\n        self.assertIn("version_compare(self::base_version($fallback), self::base_version($latest), \'>=\')", updater)\n\n'
          if 'test_manager_release_collection_lag_falls_back_to_tag_refs' in t:
              raise SystemExit('regression test already present unexpectedly')
          if marker not in t:
              raise SystemExit('test insertion marker not found')
          test_file.write_text(t.replace(marker, regression + marker, 1), encoding='utf-8')
          PY

      - name: Restore canonical health workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/project-health.yml

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          php -l bluevpn-manager/includes/class-bluevpn-github-updater.php
          python scripts/validate_php_release.py
          python -m unittest discover -s tests -p 'test_deploy_manager_source_fallback_4170.py'
          python -m unittest discover -s tests -p 'test_current_release.py'
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'bluevpn-release-bot'
          git config user.email 'bluevpn-release-bot@users.noreply.github.com'
          git add bluevpn-manager/includes/class-bluevpn-github-updater.php tests/test_deploy_manager_source_fallback_4170.py .github/workflows/project-health.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No staged repair'; exit 1; }
          git commit -m 'fix(manager): recover releases through exact manager tags [skip ci]'
          git push origin HEAD:automation/manager-release-discovery-repair
