name: Build BlueVPN APK

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - bluevpn_build

concurrency:
  group: bluevpn-release-${{ github.ref }}
  cancel-in-progress: true

env:
  BLUEVPN_TARGET_SHA: ${{ github.event.client_payload.target_sha }}
  BLUEVPN_TARGET_BRANCH: ${{ github.event.client_payload.target_branch || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize checkout with latest branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Align requested commit
        shell: bash
        run: |
          echo "Prepare repository_dispatch payload"
          git checkout -B "${BLUEVPN_TARGET_BRANCH}" "${BLUEVPN_TARGET_SHA}"
          echo "rebasing attempt avoided by explicit checkout"
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: bluevpn-apk
          path: app/build/outputs/
