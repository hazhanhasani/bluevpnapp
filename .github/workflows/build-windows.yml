name: Build BlueVPN Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'bluevpn-windows/**'
      - 'branding/app.json'
      - 'release.json'
      - 'third_party/V2RAYN.md'
      - 'third_party/AETHER_WINDOWS.md'
      - 'scripts/validate_windows.py'
      - '.github/workflows/build-windows.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            v2rayn_asset: v2rayN-windows-64.zip
          - arch: arm64
            rid: win-arm64
            v2rayn_asset: v2rayN-windows-arm64.zip

    env:
      V2RAYN_VERSION: '7.24.4'
      AETHER_VERSION: 'v1.1.1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout BlueVPN
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate Windows release contracts
        shell: pwsh
        run: python scripts/validate_windows.py

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Fetch pinned official v2rayN runtime bundle
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          ASSET: ${{ matrix.v2rayn_asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          "v2rayn-runtime-$env:RID" | Set-Content .bluevpn-windows-stage
          $target = 'bluevpn-windows/runtime/v2rayn'
          $upstream = Join-Path $target 'upstream'
          $core = Join-Path $target 'bluevpn-core'
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $upstream,$core | Out-Null

          $headers = @{ 'User-Agent' = 'BlueVPN-Windows-Build'; 'Accept' = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/2dust/v2rayN/releases/tags/$env:V2RAYN_VERSION"
          $asset = $release.assets | Where-Object { $_.name -eq $env:ASSET } | Select-Object -First 1
          if (-not $asset) { throw "v2rayN asset not found: $env:ASSET" }
          if (-not $asset.digest -or -not $asset.digest.StartsWith('sha256:')) { throw "GitHub SHA256 digest missing for $env:ASSET" }

          $zip = Join-Path $env:RUNNER_TEMP $env:ASSET
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $zip
          $expected = $asset.digest.Substring(7).ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "v2rayN SHA256 mismatch: expected=$expected actual=$actual" }
          Expand-Archive $zip -DestinationPath $upstream -Force

          function Find-One([string]$name) {
            $match = Get-ChildItem $upstream -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $match) { throw "Required v2rayN runtime file missing: $name" }
            return $match.FullName
          }
          foreach ($name in @('xray.exe','sing-box.exe','wintun.dll','geoip.dat','geosite.dat')) {
            Copy-Item (Find-One $name) (Join-Path $core $name) -Force
          }

          function Get-PeMachine([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE: $Path" }
              return ('0x{0:X4}' -f $reader.ReadUInt16())
            } finally { $stream.Dispose() }
          }
          $expectedMachine = if ($env:RID -eq 'win-arm64') { '0xAA64' } else { '0x8664' }
          foreach ($binary in @('xray.exe','sing-box.exe','wintun.dll')) {
            $actualMachine = Get-PeMachine (Join-Path $core $binary)
            if ($actualMachine -ne $expectedMachine) { throw "$binary architecture mismatch: expected=$expectedMachine actual=$actualMachine" }
          }

          $v2raynExe = Get-ChildItem $upstream -Recurse -File -Filter 'v2rayN.exe' | Select-Object -First 1
          if (-not $v2raynExe) { throw 'Required v2rayN application runtime missing: v2rayN.exe' }
          Copy-Item $v2raynExe.FullName (Join-Path $target 'v2rayN.exe') -Force
          @{
            source='2dust/v2rayN'; version=$env:V2RAYN_VERSION; asset=$env:ASSET; sha256=$actual; rid=$env:RID
          } | ConvertTo-Json | Set-Content (Join-Path $target 'runtime.json') -Encoding UTF8

          if ($env:RID -eq 'win-x64') {
            & (Join-Path $core 'xray.exe') version
            if ($LASTEXITCODE -ne 0) { throw 'Bundled v2rayN Xray self-check failed' }
            & (Join-Path $core 'sing-box.exe') version
            if ($LASTEXITCODE -ne 0) { throw 'Bundled v2rayN sing-box self-check failed' }

            # Validate the actual TUN schemas BlueVPN relies on before packaging.
            & (Join-Path $core 'xray.exe') run -test -config 'bluevpn-windows/runtime-config/xray-local-proxy-smoke.json'
            if ($LASTEXITCODE -ne 0) { throw 'Xray local proxy configuration smoke-check failed' }
            & (Join-Path $core 'sing-box.exe') check -c 'bluevpn-windows/runtime-config/singbox-v2rayn-tun-smoke.json'
            if ($LASTEXITCODE -ne 0) { throw 'sing-box v2rayN TUN configuration smoke-check failed' }
            & (Join-Path $core 'sing-box.exe') check -c 'bluevpn-windows/runtime-config/singbox-warp-smoke.json'
            if ($LASTEXITCODE -ne 0) { throw 'sing-box WARP TUN configuration smoke-check failed' }
          }

      - name: Fetch official Aether WARP runtime for x64
        if: ${{ matrix.rid == 'win-x64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "aether-runtime-win-x64" | Set-Content .bluevpn-windows-stage
          $target = 'bluevpn-windows/runtime/aether'
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $target | Out-Null
          $headers = @{ 'User-Agent' = 'BlueVPN-Windows-Build'; 'Accept' = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/CluvexStudio/Aether/releases/tags/$env:AETHER_VERSION"
          $assetName = 'aether-windows-x86_64.zip'
          $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) { throw "Aether asset not found: $assetName" }
          if (-not $asset.digest -or -not $asset.digest.StartsWith('sha256:')) { throw "GitHub SHA256 digest missing for $assetName" }
          $zip = Join-Path $env:RUNNER_TEMP $assetName
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $zip
          $expected = $asset.digest.Substring(7).ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Aether SHA256 mismatch: expected=$expected actual=$actual" }
          Expand-Archive $zip -DestinationPath $target -Force
          $aether = Get-ChildItem $target -Recurse -File -Filter 'aether.exe' | Select-Object -First 1
          if (-not $aether) { throw 'aether.exe missing from official Windows package' }
          @{
            source='CluvexStudio/Aether'; version=$env:AETHER_VERSION; asset=$assetName; sha256=$actual; architecture='x86_64'
          } | ConvertTo-Json | Set-Content (Join-Path $target 'runtime.json') -Encoding UTF8

      - name: Mark ARM64 WARP fallback contract
        if: ${{ matrix.rid == 'win-arm64' }}
        shell: pwsh
        run: |
          $target = 'bluevpn-windows/runtime/aether'
          New-Item -ItemType Directory -Force $target | Out-Null
          'Aether v1.1.1 does not publish Windows ARM64. BlueVPN uses curated Xray free-pool fallback on ARM64.' | Set-Content (Join-Path $target 'ARM64-FALLBACK.txt')

      - name: Compile Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "compile-${{ matrix.rid }}" | Set-Content .bluevpn-windows-stage
          dotnet build bluevpn-windows/BlueVPN.Windows.csproj -c Release 2>&1 | Tee-Object -FilePath windows-build.log
          exit $LASTEXITCODE

      - name: Publish self-contained Windows client
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Continue'
          "publish-$env:RID" | Set-Content .bluevpn-windows-stage
          $version = (Get-Content release.json | ConvertFrom-Json).version
          $out = "dist/BlueVPN-Windows-$env:RID"
          dotnet publish bluevpn-windows/BlueVPN.Windows.csproj `
            -c Release -r $env:RID --self-contained true `
            -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o $out 2>&1 | Tee-Object -FilePath windows-publish.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          Copy-Item README.md $out/README-BlueVPN.txt -Force
          Copy-Item NOTICE.md $out/NOTICE.txt -Force
          Copy-Item bluevpn-windows/README.md $out/README-Windows.txt -Force
          Copy-Item third_party/V2RAYN.md $out/V2RAYN-LICENSE-NOTICE.txt -Force
          Copy-Item third_party/AETHER_WINDOWS.md $out/AETHER-LICENSE-NOTICE.txt -Force
          "BlueVPN $version | $env:RID | BlueVPN Core | Free Engine $env:AETHER_VERSION" | Set-Content "$out/BUILD.txt"

      - name: Verify publish payload and architecture
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          "verify-$env:RID" | Set-Content .bluevpn-windows-stage
          $out = "dist/BlueVPN-Windows-$env:RID"
          foreach ($file in @('BlueVPN.exe','appsettings.json','runtime/v2rayn/runtime.json')) {
            if (-not (Test-Path (Join-Path $out $file))) { throw "Missing published file: $file" }
          }
          foreach ($name in @('v2rayN.exe','xray.exe','sing-box.exe','wintun.dll')) {
            if (-not (Get-ChildItem (Join-Path $out 'runtime/v2rayn') -Recurse -File -Filter $name | Select-Object -First 1)) {
              throw "Missing v2rayN runtime core: $name"
            }
          }
          if ($env:RID -eq 'win-x64' -and -not (Get-ChildItem (Join-Path $out 'runtime/aether') -Recurse -File -Filter 'aether.exe' | Select-Object -First 1)) {
            throw 'Missing Aether x64 runtime'
          }
          if ($env:RID -eq 'win-arm64' -and -not (Test-Path (Join-Path $out 'runtime/aether/ARM64-FALLBACK.txt'))) {
            throw 'Missing ARM64 WARP fallback contract'
          }

      - name: Package portable diagnostic ZIP
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          "package-portable-$env:RID" | Set-Content .bluevpn-windows-stage
          $version = (Get-Content release.json | ConvertFrom-Json).version
          $source = "dist/BlueVPN-Windows-$env:RID"
          $zip = "dist/BlueVPN-Windows-$version-$env:RID.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = Get-FileHash $zip -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($zip))" | Set-Content "$zip.sha256"

      - name: Build Windows installer
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          "installer-$env:RID" | Set-Content .bluevpn-windows-stage
          $version = (Get-Content release.json | ConvertFrom-Json).version
          $publish = (Resolve-Path "dist/BlueVPN-Windows-$env:RID").Path
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidate = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            if (Test-Path $candidate) { $iscc = $candidate }
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          New-Item -ItemType Directory -Force dist/installers | Out-Null
          & $iscc "/DMyVersion=$version" "/DMyRid=$env:RID" "/DPublishDir=$publish" bluevpn-windows/installer/BlueVPN.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }
          $generatedSetup = "dist/installers/BlueVPN-Setup-$version-$env:RID.exe"
          if (-not (Test-Path $generatedSetup)) { throw "Installer not created: $generatedSetup" }

          # Keep every release asset at the same artifact root. upload-artifact preserves
          # hierarchy below the common ancestor; leaving Setup under dist/installers/
          # makes the publish job receive windows-release/installers/... and miss it.
          $setup = "dist/BlueVPN-Setup-$version-$env:RID.exe"
          Move-Item $generatedSetup $setup -Force
          $hash = Get-FileHash $setup -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($setup))" | Set-Content "$setup.sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: BlueVPN-Windows-${{ matrix.rid }}
          path: |
            dist/BlueVPN-Windows-*.zip
            dist/BlueVPN-Windows-*.zip.sha256
            dist/BlueVPN-Setup-*.exe
            dist/BlueVPN-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: BlueVPN-Windows-${{ matrix.rid }}-diagnostics
          path: |
            windows-build.log
            windows-publish.log
            .bluevpn-windows-stage
            bluevpn-windows/runtime/v2rayn/runtime.json
            bluevpn-windows/runtime/aether/runtime.json
            bluevpn-windows/runtime/aether/ARM64-FALLBACK.txt
          if-no-files-found: ignore
          retention-days: 14

  publish-windows-release:
    name: Publish Windows installers
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: BlueVPN-Windows-win-*
          path: windows-release
          merge-multiple: true

      - name: Normalize Windows release payload layout
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          for RID in win-x64 win-arm64; do
            for NAME in \
              "BlueVPN-Windows-${VERSION}-${RID}.zip" \
              "BlueVPN-Windows-${VERSION}-${RID}.zip.sha256" \
              "BlueVPN-Setup-${VERSION}-${RID}.exe" \
              "BlueVPN-Setup-${VERSION}-${RID}.exe.sha256"; do
              TARGET="windows-release/${NAME}"
              if [ -s "$TARGET" ]; then
                continue
              fi
              mapfile -t MATCHES < <(find windows-release -type f -name "$NAME" -print)
              if [ "${#MATCHES[@]}" -ne 1 ]; then
                echo "::error::Expected exactly one artifact named $NAME, found ${#MATCHES[@]}"
                printf '%s\n' "${MATCHES[@]:-}"
                exit 1
              fi
              cp "${MATCHES[0]}" "$TARGET"
            done
          done
          echo "Normalized Windows release payload:"
          find windows-release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Validate Windows release payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          for RID in win-x64 win-arm64; do
            ZIP="windows-release/BlueVPN-Windows-${VERSION}-${RID}.zip"
            SETUP="windows-release/BlueVPN-Setup-${VERSION}-${RID}.exe"
            for FILE in "$ZIP" "$SETUP"; do
              SHA="${FILE}.sha256"
              test -s "$FILE" || { echo "::error::Missing Windows asset: $FILE"; exit 1; }
              test -s "$SHA" || { echo "::error::Missing checksum: $SHA"; exit 1; }
              EXPECTED="$(awk '{print $1}' "$SHA" | tr '[:upper:]' '[:lower:]')"
              ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
              test "$EXPECTED" = "$ACTUAL" || { echo "::error::SHA256 mismatch for $FILE"; exit 1; }
            done
            unzip -t "$ZIP" >/dev/null
          done

      - name: Publish Windows installers for website and auto-update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          WINDOWS_STAGE="$(python -c 'import json; print((json.load(open("release.json", encoding="utf-8")).get("windows") or {}).get("stage", "v2rayn-warp-installer"))')"
          # Every newly built Windows binary starts as Beta. WordPress/MySQL is
          # the release-channel authority and can promote the exact same files
          # to Stable without rebuilding them.
          WINDOWS_CHANNEL="beta"
          TAG="bluevpn-windows-v${VERSION}"
          TITLE="BlueVPN Windows ${VERSION}$([ "$WINDOWS_CHANNEL" = beta ] && printf ' Beta')"
          NOTES="BlueVPN Windows ${VERSION} — Installer رسمی، VPN سراسری، BlueVPN Core و اتصال رایگان روی x64."$'\n\n'"BlueVPN-Windows-Channel: beta"$'\n'"BlueVPN-Windows-Channel-Authority: wordpress-manager"$'\n'"BlueVPN-Windows-Stage: ${WINDOWS_STAGE}"$'\n\n'"هر Build جدید ابتدا Beta است. ارتقا به Stable از BlueVPN Manager انجام می‌شود و Build مجدد لازم ندارد."$'\n'"فایل Setup برای نصب عادی توصیه می‌شود؛ ZIP فقط برای عیب‌یابی/Portable نگه داشته شده است."
          mapfile -t ASSETS < <(find windows-release -maxdepth 1 -type f \( -name "BlueVPN-Windows-${VERSION}-win-*.zip" -o -name "BlueVPN-Windows-${VERSION}-win-*.zip.sha256" -o -name "BlueVPN-Setup-${VERSION}-win-*.exe" -o -name "BlueVPN-Setup-${VERSION}-win-*.exe.sha256" \) -print | sort)
          test "${#ASSETS[@]}" -eq 8 || { echo "::error::Expected eight Windows release assets, found ${#ASSETS[@]}"; printf '%s\n' "${ASSETS[@]}"; exit 1; }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest=false
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
            printf '{"prerelease":true}\n' | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/dev/null
          else
            ARGS=("$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest=false --prerelease)
            gh release create "${ARGS[@]}"
          fi

      - name: Verify public installer URLs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          TAG="bluevpn-windows-v${VERSION}"
          rm -rf verify-windows-release && mkdir verify-windows-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "BlueVPN-Setup-${VERSION}-win-*.exe" --dir verify-windows-release --clobber
          test -s "verify-windows-release/BlueVPN-Setup-${VERSION}-win-x64.exe"
          test -s "verify-windows-release/BlueVPN-Setup-${VERSION}-win-arm64.exe"


      - name: Push signed Windows release metadata to WordPress
        env:
          BLUEVPN_RELEASE_SYNC_SECRET: ${{ secrets.BLUEVPN_RELEASE_SYNC_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL="$(python - <<'PY2'
          import json
          from pathlib import Path
          print(json.loads(Path("branding/app.json").read_text(encoding="utf-8")).get("api_base_url", "").rstrip("/"))
          PY2
          )"
          VERSION="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          TAG="bluevpn-windows-v${VERSION}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PAYLOAD="$RUNNER_TEMP/bluevpn-windows-release-sync.json"
          RESPONSE="$RUNNER_TEMP/bluevpn-windows-release-sync-response.json"
          FALLBACK_RESPONSE="$RUNNER_TEMP/bluevpn-windows-release-refresh-response.json"
          SYNC_SECRET="${BLUEVPN_RELEASE_SYNC_SECRET:-${TELEGRAM_BOT_TOKEN:-}}"
          export VERSION TAG RELEASE_URL PUBLISHED_AT PAYLOAD

          python - <<'PY2'
          import hashlib, json, os
          from pathlib import Path
          version=os.environ['VERSION']; tag=os.environ['TAG']; release_url=os.environ['RELEASE_URL']
          base=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          files=[]
          for rid in ('win-x64','win-arm64'):
              for prefix,ext in (("BlueVPN-Setup-",'.exe'),("BlueVPN-Windows-",'.zip')):
                  name=f"{prefix}{version}-{rid}{ext}"
                  path=Path('windows-release')/name
                  if not path.is_file() or path.stat().st_size <= 0:
                      raise SystemExit(f"missing release asset for direct sync: {path}")
                  sha=hashlib.sha256(path.read_bytes()).hexdigest()
                  files.append({'name':name,'url':f'{base}/{name}','sha256':sha,'size':path.stat().st_size})
          payload={
              'version':version,'tag':tag,'release_url':release_url,'published_at':os.environ['PUBLISHED_AT'],
              'commit':os.environ.get('GITHUB_SHA',''),'title':f'BlueVPN Windows {version} Beta',
              'message':'BlueVPN-Windows-Channel: beta\nBlueVPN-Windows-Channel-Authority: wordpress-manager',
              'assets':files,
          }
          Path(os.environ['PAYLOAD']).write_text(json.dumps(payload,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY2

          DIRECT_OK=0
          LAST_HTTP="not-attempted"
          SYNC_URL="${API_BASE_URL}/wp-json/bluevpn/v1/windows/release-sync"
          if [ -n "$API_BASE_URL" ] && [ -n "$SYNC_SECRET" ]; then
            echo "Pushing authoritative Windows release metadata to WordPress: ${SYNC_URL}"
            for attempt in 1 2 3 4 5; do
              TIMESTAMP="$(date +%s)"
              export TIMESTAMP SYNC_SECRET
              SIGNATURE="$(python - <<'PY2'
          import hashlib,hmac,os
          body=open(os.environ['PAYLOAD'],'rb').read()
          msg=os.environ['TIMESTAMP'].encode()+b'\n'+body
          print(hmac.new(os.environ['SYNC_SECRET'].encode(),msg,hashlib.sha256).hexdigest())
          PY2
              )"
              : > "$RESPONSE"
              set +e
              LAST_HTTP="$(curl --silent --show-error --location --connect-timeout 10 --max-time 45 \
                -H 'Content-Type: application/json' \
                -H "X-BlueVPN-Release-Timestamp: ${TIMESTAMP}" \
                -H "X-BlueVPN-Release-Signature: ${SIGNATURE}" \
                --data-binary "@${PAYLOAD}" "$SYNC_URL" \
                --output "$RESPONSE" --write-out '%{http_code}')"
              CURL_STATUS=$?
              set -e
              echo "release-sync attempt ${attempt}/5: curl=${CURL_STATUS}, http=${LAST_HTTP}"
              if [ -s "$RESPONSE" ]; then
                python - "$RESPONSE" <<'PY2' || true
          import pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          print('WordPress release-sync response:',raw[:3000])
          PY2
              fi
              if [ "$CURL_STATUS" -eq 0 ] && [[ "$LAST_HTTP" =~ ^2[0-9][0-9]$ ]]; then
                if python - "$RESPONSE" <<'PY2'
          import json,pathlib,sys
          try:
              data=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if data.get('ok') is True else 1)
          PY2
                then
                  DIRECT_OK=1
                  break
                fi
              fi
              sleep $((attempt * 3))
            done
          else
            if [ -z "$API_BASE_URL" ]; then
              echo "::warning::api_base_url is empty; skipping direct Windows metadata push. GitHub installers remain published."
            else
              echo "::warning::No Windows release-sync secret is configured; skipping HMAC push and using WordPress pull fallback."
            fi
          fi

          if [ "$DIRECT_OK" -eq 1 ]; then
            echo "Windows release metadata registered in WordPress by signed push."
            exit 0
          fi

          # Compatibility/self-healing fallback: older Manager builds may not yet
          # have the signed endpoint or may use a different secret. The public
          # Windows update endpoint can force the Manager to pull the just-published
          # GitHub release and ingest it as Beta. Publication itself must not be
          # marked failed after the signed installers are already public.
          if [ -n "$API_BASE_URL" ]; then
            FALLBACK_URL="${API_BASE_URL}/wp-json/bluevpn/v1/windows/update?arch=win-x64&current_version=0.0.0&refresh=1&sync_version=${VERSION}&run_id=${GITHUB_RUN_ID}"
            : > "$FALLBACK_RESPONSE"
            set +e
            FALLBACK_HTTP="$(curl --silent --show-error --location --connect-timeout 10 --max-time 60 \
              "$FALLBACK_URL" --output "$FALLBACK_RESPONSE" --write-out '%{http_code}')"
            FALLBACK_CURL=$?
            set -e
            echo "WordPress pull fallback: curl=${FALLBACK_CURL}, http=${FALLBACK_HTTP}"
            if [ -s "$FALLBACK_RESPONSE" ]; then
              python - "$FALLBACK_RESPONSE" <<'PY2' || true
          import pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          print('WordPress fallback response:',raw[:3000])
          PY2
            fi
            if [ "$FALLBACK_CURL" -eq 0 ] && [[ "$FALLBACK_HTTP" =~ ^2[0-9][0-9]$ ]] && \
               python - "$FALLBACK_RESPONSE" <<'PY2'
          import json,pathlib,sys
          try:
              data=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if data.get('release_refresh_ok') is True else 1)
          PY2
            then
              echo "::warning::Signed Windows metadata push did not complete (last HTTP ${LAST_HTTP}), but WordPress pull fallback synced the GitHub release successfully."
              exit 0
            fi
          fi

          echo "::warning::Windows installers were built, checksummed, published and publicly verified, but WordPress metadata synchronization is pending. Last direct HTTP: ${LAST_HTTP}. The Manager background sync will retry automatically; this no longer converts a successful Windows publication into a failed build."
          exit 0

      - name: Verify WordPress Windows distribution state (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL="$(python - <<'PY2'
          import json
          from pathlib import Path
          print(json.loads(Path("branding/app.json").read_text(encoding="utf-8")).get("api_base_url", "").rstrip("/"))
          PY2
          )"
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::api_base_url is empty; WordPress Windows distribution verification skipped."
            exit 0
          fi
          VERSION="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          URL="${API_BASE_URL}/wp-json/bluevpn/v1/windows/update?arch=win-x64&current_version=0.0.0"
          OUT="$RUNNER_TEMP/bluevpn-windows-distribution-state.json"
          set +e
          HTTP_CODE="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            "$URL" --output "$OUT" --write-out '%{http_code}')"
          CURL_STATUS=$?
          set -e
          echo "WordPress Windows distribution probe: curl=${CURL_STATUS}, http=${HTTP_CODE}"
          if [ "$CURL_STATUS" -ne 0 ] || ! [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            [ -s "$OUT" ] && head -c 3000 "$OUT" || true
            echo "::warning::WordPress distribution state is temporarily unavailable. Windows GitHub publication remains valid and Manager background sync will retry."
            exit 0
          fi
          python - "$OUT" <<'PY2'
          import json,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          try:
              data=json.loads(path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'::warning::WordPress Windows distribution response is not JSON: {exc}')
              raise SystemExit(0)
          print('WordPress Windows latest_version:',data.get('latest_version'))
          print('WordPress Windows release_channel:',data.get('release_channel'))
          print('WordPress Windows pending_stable_version:',data.get('pending_stable_version'))
          print('WordPress Windows release_refresh_ok:',data.get('release_refresh_ok'))
          if data.get('source') != 'wordpress_windows_release_channels':
              print('::warning::Windows update endpoint is not yet using the expected WordPress/MySQL release-channel source.')
          PY2
