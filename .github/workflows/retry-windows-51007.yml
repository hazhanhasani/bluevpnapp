name: BlueVPN Retry Windows 5.10.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-windows-51007.yml'

permissions:
  contents: write
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch Windows 5.10.7 with fixed publisher
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-windows.yml --repo "$GITHUB_REPOSITORY" --ref main             -f target_sha="d6aa9394924af94ce7919c621a25d1f04e8bc150"

      - name: Remove one-time retry workflow
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          rm -f .github/workflows/retry-windows-51007.yml
          git add .github/workflows/retry-windows-51007.yml
          git commit -m "chore(ci): remove Windows 5.10.7 retry [skip ci]"
          git push origin HEAD:main
