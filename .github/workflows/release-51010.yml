name: BlueVPN Release 5.10.10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-51010.yml'
      - 'scripts/release_51010.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Apply backup self-healing and synchronize 5.10.10
        run: python scripts/release_51010.py

      - name: Commit product release
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          git add -A ':!.github/workflows'
          git commit -m "release: BlueVPN 5.10.10 backup self-healing"
          git push origin HEAD:main
