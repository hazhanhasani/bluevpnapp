name: BlueVPN Sentinel

on:
  workflow_run:
    workflows:
      - Build Signed BlueVPN APK
      - Build BlueVPN Windows
      - Release BlueVPN Manager
      - Release BlueVPN Site Theme
      - BlueVPN Project Health
      - BlueVPN External Health
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  inspect-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect every job, step and annotation and notify Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys, urllib.parse, urllib.request

          repo = os.environ['REPOSITORY']
          run_id = os.environ['RUN_ID']
          token = os.environ['GH_TOKEN']
          bot = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chats = [x.strip() for x in re.split(r'[,\s]+', os.environ.get('TELEGRAM_CHAT_ID', '')) if x.strip()]
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'BlueVPN-Sentinel/4.16.8',
          }

          def api(path):
              req = urllib.request.Request('https://api.github.com/' + path.lstrip('/'), headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          jobs = api(f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
          bad_jobs, failed_steps, annotations = [], [], []
          for job in jobs:
              jc = str(job.get('conclusion') or '')
              if jc not in ('success', 'skipped'):
                  bad_jobs.append(f"{job.get('name')} → {jc or 'unknown'}")
              for step in job.get('steps') or []:
                  sc = str(step.get('conclusion') or '')
                  if sc not in ('success', 'skipped', ''):
                      failed_steps.append(f"{job.get('name')} / {step.get('number')}. {step.get('name')} → {sc}")
              check_url = str(job.get('check_run_url') or '')
              if check_url:
                  endpoint = check_url.replace('https://api.github.com/', '').rstrip('/') + '/annotations?per_page=100'
                  try:
                      for ann in api(endpoint):
                          level = str(ann.get('annotation_level') or '')
                          if level not in ('failure', 'warning'): continue
                          path = ann.get('path') or ''
                          line = ann.get('start_line') or ''
                          msg = re.sub(r'\s+', ' ', str(ann.get('message') or '')).strip()
                          annotations.append(f"{level.upper()} {path}:{line} — {msg[:700]}")
                  except Exception as e:
                      annotations.append(f"WARNING sentinel: annotations unavailable for {job.get('name')}: {e}")

          conclusion = os.environ.get('RUN_CONCLUSION', '')
          interesting = conclusion != 'success' or bool(bad_jobs or failed_steps or annotations)
          if not interesting:
              print('Run is clean; no Telegram alert required.')
              raise SystemExit(0)

          log_excerpt = ''
          if conclusion != 'success':
              try:
                  p = subprocess.run(
                      ['gh', 'run', 'view', run_id, '--repo', repo, '--log-failed'],
                      text=True, capture_output=True, timeout=90, env={**os.environ, 'GH_TOKEN': token}
                  )
                  raw = (p.stdout or '') + '\n' + (p.stderr or '')
                  lines = []
                  for line in raw.splitlines():
                      low = line.lower()
                      if any(k in low for k in ('##[error]', '::error::', 'error ', 'exception', 'failed', 'failure', 'fatal')):
                          lines.append(re.sub(r'\s+', ' ', line).strip())
                  log_excerpt = '\n'.join(lines[-18:])[:4200]
              except Exception as e:
                  log_excerpt = f'Failed-log extraction unavailable: {e}'

          severity = '🚨' if conclusion not in ('success', '') else '⚠️'
          parts = [
              f'{severity} BlueVPN Sentinel — GitHub',
              '━━━━━━━━━━━━━━',
              f"Workflow: {os.environ.get('WORKFLOW_NAME','')}",
              f"Result: {conclusion}",
              f"Run: #{os.environ.get('RUN_NUMBER','')} attempt {os.environ.get('RUN_ATTEMPT','1')}",
              f"Branch: {os.environ.get('HEAD_BRANCH','')}",
              f"Commit: {os.environ.get('HEAD_SHA','')[:10]}",
          ]
          if bad_jobs:
              parts += ['', 'Jobs:', *[f'• {x}' for x in bad_jobs[:20]]]
          if failed_steps:
              parts += ['', 'Steps:', *[f'• {x}' for x in failed_steps[:30]]]
          if annotations:
              parts += ['', 'Annotations:', *[f'• {x}' for x in annotations[:30]]]
          if log_excerpt:
              parts += ['', 'Log excerpt:', log_excerpt]
          parts += ['', os.environ.get('RUN_URL','')]
          message = '\n'.join(parts)

          if not bot or not chats:
              print(message)
              print('::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing; Sentinel cannot notify Telegram.')
              raise SystemExit(2)

          def send(chat, text):
              data = urllib.parse.urlencode({
                  'chat_id': chat,
                  'text': text,
                  'disable_web_page_preview': 'true',
              }).encode()
              req = urllib.request.Request(f'https://api.telegram.org/bot{bot}/sendMessage', data=data)
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload = json.load(r)
              if not payload.get('ok'):
                  raise RuntimeError(payload.get('description') or 'Telegram rejected message')

          chunks = []
          remaining = message
          while remaining:
              if len(remaining) <= 3800:
                  chunks.append(remaining); break
              cut = remaining.rfind('\n', 0, 3800)
              if cut < 2500: cut = 3800
              chunks.append(remaining[:cut]); remaining = remaining[cut:].lstrip('\n')
          for chat in chats:
              for i, chunk in enumerate(chunks, 1):
                  prefix = f'[{i}/{len(chunks)}]\n' if len(chunks) > 1 else ''
                  send(chat, prefix + chunk)
          print(f'Alert sent to {len(chats)} Telegram destination(s).')
          PY
