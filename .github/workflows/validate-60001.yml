name: Validate Exact BlueVPN 6.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-60001.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9958088e94eb839bd682fde53c59f0dab5b80447
          fetch-depth: 2

      - run: python -m pip install --disable-pip-version-check pyyaml

      - name: Full BlueVPN validation
        shell: bash
        run: |
          set -euo pipefail
          php_files=$(find bluevpn-manager bluevpn-site -type f -name '*.php')
          for file in $php_files; do php -l "$file" >/dev/null; done
          python -m compileall -q scripts tests
          python scripts/validate_bundle_integrity.py
          python scripts/sync_version.py --check
          python scripts/validate_release.py
          python scripts/validate_windows.py
          python scripts/validate_php_release.py
          python -m unittest discover -s tests -p 'test_*.py' -v
