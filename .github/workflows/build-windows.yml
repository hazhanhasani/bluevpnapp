name: Build BlueVPN Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'bluevpn-windows/**'
      - 'branding/app.json'
      - 'release.json'
      - 'third_party/V2RAYN.md'
      - 'third_party/AETHER_WINDOWS.md'
      - 'scripts/validate_windows.py'
      - '.github/workflows/build-windows.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            v2rayn_asset: v2rayN-windows-64.zip
          - arch: arm64
            rid: win-arm64
            v2rayn_asset: v2rayN-windows-arm64.zip
    env:
      V2RAYN_VERSION: '7.24.4'
      AETHER_VERSION: 'v1.1.1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout BlueVPN
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Windows release contracts
        shell: pwsh
        run: python scripts/validate_windows.py
      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Fetch pinned official v2rayN runtime bundle
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          ASSET: ${{ matrix.v2rayn_asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'bluevpn-windows/runtime/v2rayn'
          $upstream = Join-Path $env:RUNNER_TEMP "v2rayn-upstream-$env:RID"
          $core = Join-Path $target 'bluevpn-core'
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $upstream -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $upstream,$core | Out-Null
          $headers = @{ 'User-Agent'='BlueVPN-Windows-Build'; 'Accept'='application/vnd.github+json' }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/2dust/v2rayN/releases/tags/$env:V2RAYN_VERSION"
          $asset = $release.assets | Where-Object { $_.name -eq $env:ASSET } | Select-Object -First 1
          if (-not $asset) { throw "v2rayN asset not found: $env:ASSET" }
          if (-not $asset.digest -or -not $asset.digest.StartsWith('sha256:')) { throw "GitHub SHA256 digest missing for $env:ASSET" }
          $zip = Join-Path $env:RUNNER_TEMP $env:ASSET
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $zip
          $expected = $asset.digest.Substring(7).ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "v2rayN SHA256 mismatch" }
          Expand-Archive $zip -DestinationPath $upstream -Force
          function Find-One([string]$name) {
            $m=Get-ChildItem $upstream -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $m) { throw "Required v2rayN application runtime missing: $name" }
            return $m.FullName
          }
          foreach ($name in @('v2rayN.exe','xray.exe','sing-box.exe','wintun.dll','geoip.dat','geosite.dat')) {
            Copy-Item (Find-One $name) (Join-Path $core $name) -Force
          }
          function Get-PeMachine([string]$Path) {
            $stream=[IO.File]::OpenRead($Path); try { $r=[IO.BinaryReader]::new($stream); $stream.Position=0x3C; $off=$r.ReadInt32(); $stream.Position=$off; if($r.ReadUInt32() -ne 0x00004550){throw "Invalid PE"}; return ('0x{0:X4}' -f $r.ReadUInt16()) } finally { $stream.Dispose() }
          }
          $expectedMachine = if ($env:RID -eq 'win-arm64') { '0xAA64' } else { '0x8664' }
          foreach ($name in @('v2rayN.exe','xray.exe','sing-box.exe','wintun.dll')) {
            $machine=Get-PeMachine (Join-Path $core $name)
            if ($machine -ne $expectedMachine) { throw "$name architecture mismatch: $machine / $expectedMachine" }
          }
          @{source='2dust/v2rayN';version=$env:V2RAYN_VERSION;asset=$env:ASSET;sha256=$actual;rid=$env:RID;layout='minimal-complete-core';files=@('v2rayN.exe','xray.exe','sing-box.exe','wintun.dll','geoip.dat','geosite.dat')} | ConvertTo-Json | Set-Content (Join-Path $target 'runtime.json') -Encoding UTF8
          if ($env:RID -eq 'win-x64') {
            & (Join-Path $core 'xray.exe') run -test -config 'bluevpn-windows/runtime-config/xray-local-proxy-smoke.json'
            if ($LASTEXITCODE -ne 0) { throw 'Xray local proxy smoke check failed' }
            & (Join-Path $core 'sing-box.exe') check -c 'bluevpn-windows/runtime-config/singbox-v2rayn-tun-smoke.json'
            if ($LASTEXITCODE -ne 0) { throw 'v2rayN TUN smoke check failed' }
            & (Join-Path $core 'sing-box.exe') check -c 'bluevpn-windows/runtime-config/singbox-warp-smoke.json'
            if ($LASTEXITCODE -ne 0) { throw 'WARP TUN smoke check failed' }
          }

      - name: Fetch official Aether WARP runtime for x64
        if: ${{ matrix.rid == 'win-x64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target='bluevpn-windows/runtime/aether'; Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $target | Out-Null
          $headers=@{'User-Agent'='BlueVPN-Windows-Build';'Accept'='application/vnd.github+json'}
          $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/CluvexStudio/Aether/releases/tags/$env:AETHER_VERSION"
          $assetName='aether-windows-x86_64.zip'; $asset=$release.assets|Where-Object{$_.name -eq $assetName}|Select-Object -First 1
          if(-not $asset -or -not $asset.digest.StartsWith('sha256:')){throw 'Aether SHA256 digest missing'}
          $zip=Join-Path $env:RUNNER_TEMP $assetName; Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $zip
          $expected=$asset.digest.Substring(7).ToLowerInvariant(); $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant(); if($expected -ne $actual){throw 'Aether SHA256 mismatch'}
          Expand-Archive $zip -DestinationPath $target -Force
          if(-not (Get-ChildItem $target -Recurse -File -Filter aether.exe | Select-Object -First 1)){throw 'aether.exe missing'}
          @{source='CluvexStudio/Aether';version=$env:AETHER_VERSION;asset=$assetName;sha256=$actual;architecture='x86_64'}|ConvertTo-Json|Set-Content (Join-Path $target 'runtime.json') -Encoding UTF8

      - name: Mark ARM64 WARP fallback contract
        if: ${{ matrix.rid == 'win-arm64' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bluevpn-windows/runtime/aether | Out-Null
          'Aether v1.1.1 has no Windows ARM64 build. BlueVPN uses curated Xray free-pool fallback on ARM64.' | Set-Content bluevpn-windows/runtime/aether/ARM64-FALLBACK.txt

      - name: Compile Windows client
        shell: pwsh
        run: dotnet build bluevpn-windows/BlueVPN.Windows.csproj -c Release

      - name: Publish self-contained Windows client
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $version=(Get-Content release.json|ConvertFrom-Json).version
          $out="dist/BlueVPN-Windows-$env:RID"
          dotnet publish bluevpn-windows/BlueVPN.Windows.csproj -c Release -r $env:RID --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o $out
          Copy-Item README.md $out/README-BlueVPN.txt -Force
          Copy-Item NOTICE.md $out/NOTICE.txt -Force
          Copy-Item bluevpn-windows/README.md $out/README-Windows.txt -Force
          Copy-Item third_party/V2RAYN.md $out/V2RAYN-LICENSE-NOTICE.txt -Force
          Copy-Item third_party/AETHER_WINDOWS.md $out/AETHER-LICENSE-NOTICE.txt -Force

      - name: Verify publish payload and architecture
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $out="dist/BlueVPN-Windows-$env:RID"
          foreach($f in @('BlueVPN.exe','appsettings.json','runtime/v2rayn/runtime.json')){if(-not(Test-Path(Join-Path $out $f))){throw "Missing published file: $f"}}

      - name: Package portable diagnostic ZIP
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $version=(Get-Content release.json|ConvertFrom-Json).version
          $source="dist/BlueVPN-Windows-$env:RID"; $zip="dist/BlueVPN-Windows-$version-$env:RID.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash=Get-FileHash $zip -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($zip))" | Set-Content "$zip.sha256"

      - name: Build Windows installer
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content release.json|ConvertFrom-Json).version
          $publish=(Resolve-Path "dist/BlueVPN-Windows-$env:RID").Path
          $iscc=(Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if(-not $iscc){$candidate='C:\Program Files (x86)\Inno Setup 6\ISCC.exe';if(Test-Path $candidate){$iscc=$candidate}}
          if(-not $iscc){choco install innosetup --no-progress -y;$iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'}
          if(-not(Test-Path $iscc)){throw 'ISCC compiler not found'}
          New-Item -ItemType Directory -Force dist/installers | Out-Null
          & $iscc "/DMyVersion=$version" "/DMyRid=$env:RID" "/DPublishDir=$publish" bluevpn-windows/installer/BlueVPN.iss
          if($LASTEXITCODE -ne 0){throw "ISCC failed $LASTEXITCODE"}
          $generatedSetup="dist/installers/BlueVPN-Setup-$version-$env:RID.exe"
          if(-not(Test-Path $generatedSetup)){throw "Installer not created: $generatedSetup"}
          $setup = "dist/BlueVPN-Setup-$version-$env:RID.exe"
          Move-Item $generatedSetup $setup -Force
          $hash=Get-FileHash $setup -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($setup))" | Set-Content "$setup.sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: BlueVPN-Windows-${{ matrix.rid }}
          path: |
            dist/BlueVPN-Windows-*.zip
            dist/BlueVPN-Windows-*.zip.sha256
            dist/BlueVPN-Setup-*.exe
            dist/BlueVPN-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: BlueVPN-Windows-${{ matrix.rid }}-diagnostics
          path: |
            bluevpn-windows/runtime/v2rayn/runtime.json
            bluevpn-windows/runtime/aether/runtime.json
            bluevpn-windows/runtime/aether/ARM64-FALLBACK.txt
          if-no-files-found: ignore

  publish-windows-release:
    name: Publish Windows installers
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: BlueVPN-Windows-win-*
          path: windows-release
          merge-multiple: true

      - name: Normalize Windows release payload layout
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json;print(json.load(open("release.json"))["version"])')"
          for RID in win-x64 win-arm64; do
            for NAME in "BlueVPN-Windows-${VERSION}-${RID}.zip" "BlueVPN-Windows-${VERSION}-${RID}.zip.sha256" "BlueVPN-Setup-${VERSION}-${RID}.exe" "BlueVPN-Setup-${VERSION}-${RID}.exe.sha256"; do
              TARGET="windows-release/${NAME}"
              [ -s "$TARGET" ] && continue
              mapfile -t MATCHES < <(find windows-release -type f -name "$NAME" -print)
              if [ "${#MATCHES[@]}" -ne 1 ]; then echo "::error::Expected exactly one artifact named $NAME, found ${#MATCHES[@]}"; exit 1; fi
              cp "${MATCHES[0]}" "$TARGET"
            done
          done

      - name: Validate Windows release payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json;print(json.load(open("release.json"))["version"])')"
          for RID in win-x64 win-arm64; do
            ZIP="windows-release/BlueVPN-Windows-${VERSION}-${RID}.zip"; SETUP="windows-release/BlueVPN-Setup-${VERSION}-${RID}.exe"
            for FILE in "$ZIP" "$SETUP"; do
              test -s "$FILE"; test -s "$FILE.sha256"
              EXPECTED="$(awk '{print $1}' "$FILE.sha256"|tr '[:upper:]' '[:lower:]')"; ACTUAL="$(sha256sum "$FILE"|awk '{print $1}')"; test "$EXPECTED" = "$ACTUAL"
            done
            unzip -t "$ZIP" >/dev/null
          done

      - name: Publish Windows installers for website and auto-update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json;print(json.load(open("release.json"))["version"])')"
          WINDOWS_CHANNEL="beta"
          TAG="bluevpn-windows-v${VERSION}"
          TITLE="BlueVPN Windows ${VERSION} Beta"
          NOTES="BlueVPN Windows ${VERSION}"$'\n'"BlueVPN-Windows-Channel: beta"$'\n'"BlueVPN-Windows-Channel-Authority: wordpress-manager"
          mapfile -t ASSETS < <(find windows-release -maxdepth 1 -type f -name "BlueVPN-*${VERSION}-win-*" -print | sort)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest=false
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
            printf '{"prerelease":true}\n' | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/dev/null
          else
            ARGS=("$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest=false --prerelease)
            gh release create "${ARGS[@]}"
          fi

      - name: Verify public installer URLs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json;print(json.load(open("release.json"))["version"])')"; TAG="bluevpn-windows-v${VERSION}"
          rm -rf verify-windows-release && mkdir verify-windows-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "BlueVPN-Setup-${VERSION}-win-*.exe" --dir verify-windows-release --clobber
          test -s "verify-windows-release/BlueVPN-Setup-${VERSION}-win-x64.exe"
          test -s "verify-windows-release/BlueVPN-Setup-${VERSION}-win-arm64.exe"

      - name: Push signed Windows release metadata to WordPress
        env:
          BLUEVPN_RELEASE_SYNC_SECRET: ${{ secrets.BLUEVPN_RELEASE_SYNC_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json;print(json.load(open("release.json"))["version"])')"
          TAG="bluevpn-windows-v${VERSION}"; WINDOWS_CHANNEL="beta"
          SYNC_SECRET="${BLUEVPN_RELEASE_SYNC_SECRET:-${TELEGRAM_BOT_TOKEN:-}}"
          API_BASE="$(python -c 'import json;print(json.load(open("branding/app.json"))["api_base_url"].rstrip("/"))')"
          if [ -z "$SYNC_SECRET" ]; then echo '::warning::No direct release sync secret; WordPress pull fallback will reconcile.'; exit 0; fi
          X64_SHA="$(awk '{print $1}' "windows-release/BlueVPN-Setup-${VERSION}-win-x64.exe.sha256")"
          ARM64_SHA="$(awk '{print $1}' "windows-release/BlueVPN-Setup-${VERSION}-win-arm64.exe.sha256")"
          RAW="$(python - "$VERSION" "$TAG" "$X64_SHA" "$ARM64_SHA" <<'PY'
          import json,sys
          v,tag,x64,arm=sys.argv[1:]
          print(json.dumps({'version':v,'channel':'beta','tag':tag,'prerelease':True,'assets':{'win-x64':{'name':f'BlueVPN-Setup-{v}-win-x64.exe','sha256':x64},'win-arm64':{'name':f'BlueVPN-Setup-{v}-win-arm64.exe','sha256':arm}}},separators=(',',':')))
          PY
          )"
          TIMESTAMP="$(date +%s)"
          SIGNATURE="$(python - "$SYNC_SECRET" "$TIMESTAMP" "$RAW" <<'PY'
          import hashlib,hmac,sys
          secret,ts,raw=sys.argv[1:]; print(hmac.new(secret.encode(),(ts+'\n'+raw).encode(),hashlib.sha256).hexdigest())
          PY
          )"
          LAST_HTTP=000; CURL_STATUS=0
          for attempt in 1 2 3 4 5; do
            set +e
            LAST_HTTP="$(curl --silent --show-error --output "$RUNNER_TEMP/windows-release-sync.json" --write-out '%{http_code}' --max-time 30 \
              -X POST -H 'Content-Type: application/json' -H "X-BlueVPN-Release-Timestamp: ${TIMESTAMP}" -H "X-BlueVPN-Release-Signature: ${SIGNATURE}" \
              --data "$RAW" "${API_BASE}/wp-json/bluevpn/v1/windows/release-sync")"; CURL_STATUS=$?; set -e
            echo "release-sync attempt ${attempt}/5: curl=${CURL_STATUS}, http=${LAST_HTTP}"
            if [ "$CURL_STATUS" -eq 0 ] && [[ "$LAST_HTTP" =~ ^2 ]]; then break; fi
            sleep $((attempt*2))
          done
          if [ "$CURL_STATUS" -ne 0 ] || ! [[ "$LAST_HTTP" =~ ^2 ]]; then
            echo '::warning::Direct release metadata push did not converge; WordPress pull fallback will run.'
          fi

          # WordPress pull fallback is diagnostic/reconciliation only; public installers are already valid.
          FALLBACK_URL="${API_BASE}/wp-json/bluevpn/v1/windows/update?arch=win-x64&current_version=0.0.0&refresh=1"
          if curl --fail --silent --show-error --max-time 35 "$FALLBACK_URL" -o "$RUNNER_TEMP/windows-fallback.json"; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'windows-fallback.json').read_text())
          print('fallback latest',data.get('latest_version'))
          print('fallback refresh',data.get('release_refresh_ok'))
          if data.get('release_refresh_ok') is True: print('WordPress pull fallback PASS')
          PY
          else
            echo '::warning::WordPress distribution state is temporarily unavailable; Windows installers were built, checksummed, published and publicly verified.'
          fi
          echo 'Windows installers were built, checksummed, published and publicly verified.'
          exit 0

      - name: Verify WordPress Windows distribution state (diagnostic)
        shell: bash
        run: |
          set +e
          API_BASE="$(python -c 'import json;print(json.load(open("branding/app.json"))["api_base_url"].rstrip("/"))')"
          PROBE_URL="${API_BASE}/wp-json/bluevpn/v1/windows/update?arch=win-x64&current_version=0.0.0"
          if ! curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 25 "$PROBE_URL" -o "$RUNNER_TEMP/windows-distribution-state.json"; then
            echo '::warning::WordPress distribution state is temporarily unavailable; published Windows installers remain authoritative and public.'
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'windows-distribution-state.json').read_text(encoding='utf-8'))
          print('WordPress Windows distribution version:', data.get('latest_version'))
          print('WordPress Windows distribution channel:', data.get('release_channel'))
          PY
          exit 0
