name: BlueVPN Release Token Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-token-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      RELEASE_PAT: ${{ secrets.BLUEVPN_GITHUB_RELEASE_TOKEN }}
    steps:
      - name: Report token availability
        shell: bash
        run: |
          if [ -n "${RELEASE_PAT:-}" ]; then
            echo "BLUEVPN_GITHUB_RELEASE_TOKEN_PRESENT=true"
          else
            echo "BLUEVPN_GITHUB_RELEASE_TOKEN_PRESENT=false"
          fi
      - name: Check workflow token permissions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY} --jq '.permissions'
