name: BlueVPN Bump 5.10.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-51008.yml'

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Sync BlueVPN 5.10.8 everywhere
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, json

          old_version = "5.10.7"
          new_version = "5.10.8"
          old_code = "51007"
          new_code = "51008"

          paths = subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")
          changed = []
          for raw in paths:
              if not raw:
                  continue
              if raw.startswith(".github/workflows/"):
                  continue
              p = Path(raw)
              try:
                  data = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = data.replace(old_version, new_version).replace(old_code, new_code)
              if updated != data:
                  p.write_text(updated, encoding="utf-8")
                  changed.append(raw)

          print(f"Updated {len(changed)} tracked UTF-8 files")
          for p in changed:
              print(p)

          checks = {
              "version.json": ("version", new_version, "version_code", int(new_code)),
              "release.json": ("version", new_version, "version_code", int(new_code)),
              "branding/app.json": ("version_name", new_version, "version_code", int(new_code)),
          }
          for filename, spec in checks.items():
              obj = json.loads(Path(filename).read_text(encoding="utf-8"))
              k1,v1,k2,v2 = spec
              if obj.get(k1) != v1 or obj.get(k2) != v2:
                  raise SystemExit(f"{filename} version sync failed: {obj.get(k1)} / {obj.get(k2)}")
          PY

          git diff --check
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "release: BlueVPN 5.10.8"
          git push origin HEAD:main

      - name: Dispatch validated release pipeline on version commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION_SHA="$(git rev-parse HEAD)"
          echo "Dispatching BlueVPN Project Health for 5.10.8 at $VERSION_SHA"
          gh workflow run project-health.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "$VERSION_SHA" > "$RUNNER_TEMP/version-sha"

