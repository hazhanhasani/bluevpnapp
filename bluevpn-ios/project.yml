name: BlueVPN
options:
  bundleIdPrefix: ir.blluepanel
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: 6.1.10
    CURRENT_PROJECT_VERSION: 60110
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftyXrayKit:
    url: https://github.com/dima-u/SwiftyXrayKit.git
    revision: 3c5405521ae547de110f6ea65df00b1c05f6a0bc
targets:
  BlueVPN:
    type: application
    platform: iOS
    settings:
      base:
        # Must be the exact lowercase prefix of the embedded Packet Tunnel ID.
        PRODUCT_BUNDLE_IDENTIFIER: ir.blluepanel.bluevpn
    sources: [BlueVPNApp]
    resources: [Resources]
    info:
      path: BlueVPNApp/Info.plist
      properties:
        CFBundleDisplayName: BlueVPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Automatic
        CFBundleURLTypes:
          - CFBundleURLSchemes: [bluevpn]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: BlueVPNApp/BlueVPN.entitlements
      properties:
        com.apple.security.application-groups: [group.ir.blluepanel.bluevpn]
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - target: BlueVPNTunnel
        embed: true
  BlueVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - BlueXrayRuntime.swift
          - BlueRuntimeContract.swift
    resources: [PacketTunnelResources]
    dependencies:
      - package: SwiftyXrayKit
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: BlueVPN Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/BlueVPNTunnel.entitlements
      properties:
        com.apple.security.application-groups: [group.ir.blluepanel.bluevpn]
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.blluepanel.bluevpn.tunnel
        SKIP_INSTALL: YES
schemes:
  BlueVPN:
    build:
      targets:
        BlueVPN: all
        BlueVPNTunnel: all
