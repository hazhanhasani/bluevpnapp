name: BlueVPN Manager Release Discovery Repair

on:
  push:
    branches:
      - automation/manager-release-discovery-repair

permissions:
  contents: write

jobs:
  build-validated-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Apply Manager release discovery repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          updater = Path('bluevpn-manager/includes/class-bluevpn-github-updater.php')
          s = updater.read_text(encoding='utf-8')
          marker = '''    /**
           * @return array|WP_Error|null Normalized release, error, or null when no plugin release exists.
           */
          public static function latest_release(bool $force = false) {
          '''
          helper = r'''    /**
           * Resolve the newest stable Manager release through tag refs, then fetch
           * that release by its exact tag. GitHub's releases collection can lag
           * behind a just-published component release even while the tag-specific
           * endpoint is already consistent.
           *
           * @return array|WP_Error|null
           */
          private static function latest_release_from_refs() {
              $s = self::settings();
              $prefix = (string)$s['tag_prefix'];
              $url = 'https://api.github.com/repos/' . rawurlencode((string)$s['owner']) . '/' . rawurlencode((string)$s['repo']) . '/git/matching-refs/tags/' . rawurlencode($prefix);
              $response = wp_remote_get($url, [
                  'timeout' => 12,
                  'redirection' => 3,
                  'headers' => self::request_headers(false),
              ]);
              if (is_wp_error($response)) return $response;

              $status = (int)wp_remote_retrieve_response_code($response);
              if ($status !== 200) {
                  return new WP_Error('bluevpn_github_refs_http', 'GitHub Manager tag refs HTTP ' . $status);
              }

              $refs = json_decode(wp_remote_retrieve_body($response), true);
              if (!is_array($refs)) {
                  return new WP_Error('bluevpn_github_refs_json', 'پاسخ GitHub Manager tag refs معتبر نیست.');
              }

              $refPrefix = 'refs/tags/' . $prefix;
              $versions = [];
              foreach ($refs as $row) {
                  if (!is_array($row)) continue;
                  $ref = (string)($row['ref'] ?? '');
                  if ($ref === '' || strpos($ref, $refPrefix) !== 0) continue;
                  $version = substr($ref, strlen($refPrefix));
                  if (!preg_match('/^\d+\.\d+\.\d+$/', $version)) continue;
                  $versions[$version] = true;
              }
              if (!$versions) return null;

              $versions = array_keys($versions);
              usort($versions, static fn($a, $b) => version_compare($b, $a));

              // A tag can exist moments before its Release object is published.
              // Walk only a bounded set of newest tags and confirm each through the
              // exact Release endpoint, which also validates the expected ZIP asset.
              foreach (array_slice($versions, 0, 12) as $version) {
                  $release = self::release_by_version((string)$version, 1);
                  if (is_array($release)) return $release;
                  if (is_wp_error($release)) return $release;
              }
              return null;
          }

              /**
           * @return array|WP_Error|null Normalized release, error, or null when no plugin release exists.
           */
          public static function latest_release(bool $force = false) {
          '''
          if marker not in s:
              raise SystemExit('latest_release marker not found')
          s = s.replace(marker, helper, 1)

          old_tail = '''        if (!$candidates) {
              set_site_transient(self::CACHE_KEY, 'none', self::CACHE_TTL);
              return null;
          }

          usort($candidates, static fn($a, $b) => version_compare($b['version'], $a['version']));
          $latest = $candidates[0];
          $latest['version'] = self::effective_version($latest);
          set_site_transient(self::CACHE_KEY, $latest, self::CACHE_TTL);
          return $latest;
          '''
          new_tail = '''        $latest = null;
          if ($candidates) {
              usort($candidates, static fn($a, $b) => version_compare($b['version'], $a['version']));
              $latest = $candidates[0];
              $latest['version'] = self::effective_version($latest);
          }

          // Do not spend extra GitHub requests while the releases collection is
          // already advertising a semantic update. If it has no Manager entry,
          // or only reports the installed/older version, verify the newest tag
          // through matching refs + the exact Release endpoint. This recovers
          // from GitHub collection lag without turning every poll into 3 calls.
          $needsRefFallback = !is_array($latest)
              || version_compare(self::base_version($latest), BLUEVPN_MANAGER_VERSION, '<=');
          if ($needsRefFallback) {
              $fallback = self::latest_release_from_refs();
              if (is_array($fallback)) {
                  if (!is_array($latest) || version_compare(self::base_version($fallback), self::base_version($latest), '>=')) {
                      $latest = $fallback;
                  }
              } elseif (is_wp_error($fallback) && !is_array($latest)) {
                  return $fallback;
              }
          }

          if (!is_array($latest)) {
              set_site_transient(self::CACHE_KEY, 'none', self::CACHE_TTL);
              return null;
          }

          set_site_transient(self::CACHE_KEY, $latest, self::CACHE_TTL);
          return $latest;
          '''
          if old_tail not in s:
              raise SystemExit('latest_release candidate tail not found')
          updater.write_text(s.replace(old_tail, new_tail, 1), encoding='utf-8')

          test_file = Path('tests/test_deploy_manager_source_fallback_4170.py')
          t = test_file.read_text(encoding='utf-8')
          insert_before = "    def test_project_root_accepts_wrappers_and_normalizes_versioned_manager_folder(self):\n"
          regression = '''    def test_manager_release_collection_lag_falls_back_to_tag_refs(self):
              updater = text('bluevpn-manager/includes/class-bluevpn-github-updater.php')
              self.assertIn('private static function latest_release_from_refs', updater)
              self.assertIn('/git/matching-refs/tags/', updater)
              self.assertIn('release_by_version((string)$version, 1)', updater)
              self.assertIn('$needsRefFallback', updater)
              self.assertIn("version_compare(self::base_version($latest), BLUEVPN_MANAGER_VERSION, '<=')", updater)
              self.assertIn("version_compare(self::base_version($fallback), self::base_version($latest), '>=')", updater)

          '''
          if regression.strip() in t:
              raise SystemExit('regression test already present unexpectedly')
          if insert_before not in t:
              raise SystemExit('test insertion marker not found')
          test_file.write_text(t.replace(insert_before, regression + insert_before, 1), encoding='utf-8')
          PY

      - name: Restore canonical health workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/project-health.yml

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          php -l bluevpn-manager/includes/class-bluevpn-github-updater.php
          python scripts/validate_php_release.py
          python -m unittest discover -s tests -p 'test_deploy_manager_source_fallback_4170.py'
          python -m unittest discover -s tests -p 'test_current_release.py'
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'bluevpn-release-bot'
          git config user.email 'bluevpn-release-bot@users.noreply.github.com'
          git add bluevpn-manager/includes/class-bluevpn-github-updater.php tests/test_deploy_manager_source_fallback_4170.py .github/workflows/project-health.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No staged repair'; exit 1; }
          git commit -m 'fix(manager): recover releases through exact manager tags [skip ci]'
          git push origin HEAD:automation/manager-release-discovery-repair
