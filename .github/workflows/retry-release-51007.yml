name: BlueVPN Retry 5.10.7 Failed Releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-release-51007.yml'

permissions:
  contents: write
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout retry source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import json;print(json.load(open("version.json"))["version"])')" = "5.10.7"

      - name: Retry Android Windows and Theme
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='bluevpn_build' \
            -F 'client_payload[ref]'='main' \
            -F 'client_payload[target_sha]'="$SOURCE_SHA" \
            -F 'client_payload[build_mode]'='full'

          gh workflow run build-windows.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f target_sha="$SOURCE_SHA"
          gh workflow run bluevpn-site-theme-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f target_sha="$SOURCE_SHA"

      - name: Remove retry workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          git pull --ff-only origin main
          rm -f .github/workflows/retry-release-51007.yml
          git add .github/workflows/retry-release-51007.yml
          git commit -m "chore(ci): remove one-time 5.10.7 retry [skip ci]"
          git push origin HEAD:main
