name: Build Signed BlueVPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - bluevpn_build


# Keep only the newest build for each branch. This prevents old queued
# workflow runs from blocking a newly uploaded release.
concurrency:
  group: bluevpn-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      BLUEVPN_TARGET_BRANCH: ${{ github.event.client_payload.ref || github.ref_name }}
      BLUEVPN_TARGET_SHA: ${{ github.event.client_payload.target_sha || github.sha }}

    steps:
      - name: Checkout BlueVPN project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize pre-build diagnostics
        shell: bash
        run: |
          set -euo pipefail
          : > "$GITHUB_WORKSPACE/android-build.log"
          echo "BUILD_STAGE=initialize-build" >> "$GITHUB_ENV"
          echo "initialize-build" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"
          echo "BlueVPN pre-Gradle diagnostics initialized." | tee -a "$GITHUB_WORKSPACE/android-build.log"

      - name: Synchronize checkout with latest branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BLUEVPN_TARGET_BRANCH}" --prune
          git checkout -B "${BLUEVPN_TARGET_BRANCH}" "${BLUEVPN_TARGET_SHA}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$BLUEVPN_TARGET_SHA" ]; then
            echo "::error::Requested source SHA was not checked out. Expected=$BLUEVPN_TARGET_SHA Actual=$ACTUAL_SHA"
            exit 1
          fi
          echo "BUILD_STAGE=source-synchronized" >> "$GITHUB_ENV"
          echo "source-synchronized" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"
          echo "Building requested commit: ${ACTUAL_SHA}"

      - name: Check permanent signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Resolve next BlueVPN version
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Only app tags participate in Android version resolution.
          # WordPress releases use bluevpn-manager-vX.Y.Z and must never
          # influence the next APK version.
          git fetch --tags --force >/dev/null 2>&1 || true
          LATEST_TAG="$(git tag -l 'v4.*' --sort=-v:refname | head -n 1 || true)"

          export LATEST_TAG
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          app_path = Path("branding/app.json")
          release_path = Path("release.json")
          app = json.loads(app_path.read_text(encoding="utf-8"))
          release = json.loads(release_path.read_text(encoding="utf-8"))

          def parse_v4(value: object):
              match = re.fullmatch(
                  r"v?(4)\.(\d+)\.(\d+)",
                  str(value or "").strip(),
              )
              if not match:
                  return None
              return tuple(map(int, match.groups()))

          base = (4, 0, 0)
          candidates = [
              parse_v4(app.get("version_name")),
              parse_v4(release.get("version")),
          ]
          project_version = max([v for v in candidates if v is not None] or [base])
          published_version = parse_v4(os.environ.get("LATEST_TAG"))

          # First build after moving from 3.x starts exactly at 4.0.0.
          # Later releases increment patch and roll 4.x.99 to the next minor.
          if published_version is None or project_version > published_version:
              resolved = max(project_version, base)
          else:
              major, minor, patch = published_version
              patch += 1
              if patch >= 100:
                  minor += 1
                  patch = 0
              resolved = (major, minor, patch)

          version = ".".join(map(str, resolved))
          major, minor, patch = resolved
          version_code = major * 10000 + minor * 100 + patch
          next_patch = patch

          app["version_name"] = version
          app["version_code"] = version_code
          app["version_source"] = (
              "project_release_or_latest_github_release_increment"
          )
          app_path.write_text(
              json.dumps(app, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          release["version"] = version
          release["version_code"] = version_code
          release["android_version"] = version
          release["android_version_code"] = version_code
          release_path.write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          for metadata_path in (
              Path("deployment-marker.json"),
              Path("validation-report.json"),
          ):
              if not metadata_path.exists():
                  continue
              metadata = json.loads(
                  metadata_path.read_text(encoding="utf-8")
              )
              if metadata_path.name == "deployment-marker.json":
                  metadata["release"] = f"{version}-auto"
                  metadata["version_name"] = version
              else:
                  metadata["project_version"] = version
                  metadata["release"] = version
              metadata["version_code"] = version_code
              metadata_path.write_text(
                  json.dumps(
                      metadata,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
              stream.write(f"version_code={version_code}\n")
              stream.write(f"previous_tag={os.environ.get('LATEST_TAG', '')}\n")
              stream.write(f"next_patch={next_patch}\n")

          print(f"Project version: {project_version[0]}.{project_version[1]}.{project_version[2]}")
          print(f"Latest GitHub Release: {os.environ.get('LATEST_TAG') or 'none'}")
          print(f"Android build version: {version} ({version_code})")
          PY

          echo "upstream_ref=$(python -c 'import json; print(json.load(open("branding/app.json"))["upstream_ref"])')" >> "$GITHUB_OUTPUT"
          echo "sing_box_ref=$(python -c 'import json; print(json.load(open("branding/app.json"))["sing_box_ref"])')" >> "$GITHUB_OUTPUT"

      - name: Synchronize WordPress Manager with BlueVPN version
        shell: bash
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          echo "BUILD_STAGE=sync-wordpress-manager" >> "$GITHUB_ENV"
          echo "sync-wordpress-manager" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"
          exec > >(tee -a "$GITHUB_WORKSPACE/android-build.log") 2>&1
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          main = Path("bluevpn-manager/bluevpn-manager.php")
          readme = Path("bluevpn-manager/readme.txt")
          if not main.exists():
              raise SystemExit("bluevpn-manager/bluevpn-manager.php is missing")

          text = main.read_text(encoding="utf-8")
          text, n1 = re.subn(
              r"(?mi)^(\s*\*?\s*Version:\s*)\d+\.\d+\.\d+(\s*)$",
              lambda m: m.group(1) + version + m.group(2),
              text,
              count=1,
          )
          text, n2 = re.subn(
              r"define\(\s*(['\"])BLUEVPN_MANAGER_VERSION\1\s*,\s*(['\"])[^'\"]+\2\s*\)\s*;",
              lambda m: f"define({m.group(1)}BLUEVPN_MANAGER_VERSION{m.group(1)}, {m.group(2)}{version}{m.group(2)});",
              text,
              count=1,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Could not synchronize plugin version header/constant: header={n1} constant={n2}")
          main.write_text(text, encoding="utf-8")

          if readme.exists():
              r = readme.read_text(encoding="utf-8")
              r, n = re.subn(
                  r"(?mi)^(Version:\s*)\d+\.\d+\.\d+(\s*)$",
                  lambda m: m.group(1) + version + m.group(2),
                  r,
                  count=1,
              )
              if n != 1:
                  raise SystemExit("Could not synchronize readme Version")
              readme.write_text(r, encoding="utf-8")

          print(f"BlueVPN Manager synchronized to {version}")
          PY

          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find bluevpn-manager -type f -name '*.php' -print0)

      - name: Persist resolved version in repository
        id: persist_metadata
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.client_payload.ref || github.ref_name }}
        run: |
          set -euo pipefail
          echo "BUILD_STAGE=persist-version-metadata" >> "$GITHUB_ENV"
          echo "persist-version-metadata" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"
          exec > >(tee -a "$GITHUB_WORKSPACE/android-build.log") 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            branding/app.json \
            release.json \
            deployment-marker.json \
            validation-report.json \
            bluevpn-manager

          if ! git diff --cached --quiet; then
            git commit -m "chore: persist BlueVPN ${{ steps.config.outputs.version }} metadata [skip ci]"
          else
            echo "Version metadata is already synchronized."
          fi

          PUSHED=0
          PUSH_LOG="$RUNNER_TEMP/bluevpn-metadata-push.log"
          : > "$PUSH_LOG"
          for attempt in 1 2 3 4 5; do
            # Rebase before every attempt so a remote bot/user commit does not
            # generate a noisy non-fast-forward error that later looks fatal.
            git fetch origin "${TARGET_BRANCH}" --prune
            git rebase "origin/${TARGET_BRANCH}"
            if git push --porcelain origin "HEAD:${TARGET_BRANCH}" >"$PUSH_LOG" 2>&1; then
              cat "$PUSH_LOG"
              PUSHED=1
              break
            fi

            echo "Metadata push retry ${attempt}/5; remote branch changed while this run was active."
            sleep $((attempt * 2))
          done

          if [ "$PUSHED" != "1" ]; then
            echo "::error::Version metadata could not be persisted after five synchronized retries."
            sed 's/^/[git-push-final] /' "$PUSH_LOG" || true
            exit 1
          fi

          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_AFTER=""
          for attempt in 1 2 3 4 5 6 7 8; do
            REMOTE_AFTER="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            if [ "$REMOTE_AFTER" = "$LOCAL_SHA" ]; then
              break
            fi
            sleep 2
          done

          if [ "$REMOTE_AFTER" != "$LOCAL_SHA" ]; then
            echo "::error::Version metadata was not verifiably persisted to GitHub. Local=$LOCAL_SHA Remote=$REMOTE_AFTER"
            exit 1
          fi

          echo "source_sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "repository_commit_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${LOCAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "Verified GitHub metadata commit: $LOCAL_SHA"

      - name: Publish synchronized BlueVPN Manager release barrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.config.outputs.version }}
          SOURCE_COMMIT: ${{ steps.persist_metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          echo "BUILD_STAGE=publish-wordpress-manager-release" >> "$GITHUB_ENV"
          echo "publish-wordpress-manager-release" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"
          exec > >(tee -a "$GITHUB_WORKSPACE/android-build.log") 2>&1

          # Production WordPress and the APK must move together. The previous
          # design delegated this to a second workflow_run, so the APK could be
          # delivered while WordPress was still several versions behind.
          if [ "${BLUEVPN_TARGET_BRANCH}" != "main" ]; then
            echo "Non-main build; BlueVPN Manager production release skipped."
            exit 0
          fi

          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find bluevpn-manager -type f -name '*.php' -print0)

          rm -rf "$RUNNER_TEMP/bluevpn-manager-inline-release"
          mkdir -p "$RUNNER_TEMP/bluevpn-manager-inline-release/bluevpn-manager"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            bluevpn-manager/ \
            "$RUNNER_TEMP/bluevpn-manager-inline-release/bluevpn-manager/"

          (
            cd "$RUNNER_TEMP/bluevpn-manager-inline-release"
            zip -qr "$GITHUB_WORKSPACE/bluevpn-manager.zip" bluevpn-manager
          )
          unzip -t bluevpn-manager.zip >/dev/null
          sha256sum bluevpn-manager.zip > bluevpn-manager.zip.sha256

          LOCAL_PLUGIN_VERSION="$(
            unzip -p bluevpn-manager.zip bluevpn-manager/bluevpn-manager.php \
              | sed -nE 's/^ \* Version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
              | head -n 1
          )"
          if [ "$LOCAL_PLUGIN_VERSION" != "$VERSION" ]; then
            echo "::error::Plugin package version mismatch. APK=$VERSION Plugin=$LOCAL_PLUGIN_VERSION"
            exit 1
          fi

          TAG="bluevpn-manager-v${VERSION}"
          NOTES="BlueVPN Manager ${VERSION} — نسخه همگام با APK ${VERSION}. انتشار این بسته بخشی از Release Barrier اصلی BlueVPN است."

          refresh_release() {
            gh release upload "$TAG" \
              bluevpn-manager.zip \
              bluevpn-manager.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" \
              --title "BlueVPN Manager ${VERSION}" \
              --notes "$NOTES" \
              --latest=false
          }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            refresh_release
          else
            # gh release view + create is not atomic. A manual emergency publish
            # can win the race between these two commands, so creation failure is
            # recovered by re-reading and refreshing the now-existing release.
            if ! gh release create "$TAG" \
              bluevpn-manager.zip \
              bluevpn-manager.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" \
              --title "BlueVPN Manager ${VERSION}" \
              --notes "$NOTES" \
              --latest=false; then
              echo "Release create returned an error; checking whether another publisher created ${TAG}."
              sleep 3
              if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                refresh_release
              else
                echo "::error::Could not create or recover ${TAG}."
                exit 1
              fi
            fi
          fi

          rm -rf "$RUNNER_TEMP/bluevpn-manager-inline-verify"
          mkdir -p "$RUNNER_TEMP/bluevpn-manager-inline-verify"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'bluevpn-manager.zip' \
            --dir "$RUNNER_TEMP/bluevpn-manager-inline-verify" \
            --clobber
          REMOTE="$RUNNER_TEMP/bluevpn-manager-inline-verify/bluevpn-manager.zip"
          unzip -t "$REMOTE" >/dev/null
          REMOTE_VERSION="$(
            unzip -p "$REMOTE" bluevpn-manager/bluevpn-manager.php \
              | sed -nE 's/^ \* Version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
              | head -n 1
          )"
          if [ "$REMOTE_VERSION" != "$VERSION" ]; then
            echo "::error::Published manager release mismatch. Expected=$VERSION Remote=$REMOTE_VERSION"
            exit 1
          fi

          echo "Manager release barrier passed: ${TAG} / bluevpn-manager.zip / ${REMOTE_VERSION}"

      - name: Wait for WordPress control-plane auto-update
        shell: bash
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          echo "BUILD_STAGE=wait-wordpress-auto-update" >> "$GITHUB_ENV"
          echo "wait-wordpress-auto-update" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"
          exec > >(tee -a "$GITHUB_WORKSPACE/android-build.log") 2>&1
          if [ "${BLUEVPN_TARGET_BRANCH}" != "main" ]; then
            echo "Non-main build; WordPress production convergence check skipped."
            exit 0
          fi

          API_BASE_URL="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('branding/app.json').read_text(encoding='utf-8')).get('api_base_url','').rstrip('/'))
          PY
          )"
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::api_base_url is empty; cannot verify WordPress convergence."
            exit 1
          fi

          EXPECTED_SCHEMA="$(sed -nE "s/^define\('BLUEVPN_MANAGER_SCHEMA_VERSION', '([^']+)'\);/\1/p" bluevpn-manager/bluevpn-manager.php | head -n 1)"
          if [ -z "$EXPECTED_SCHEMA" ]; then
            echo "::error::Could not read BLUEVPN_MANAGER_SCHEMA_VERSION."
            exit 1
          fi

          HEALTH_URL="${API_BASE_URL}/health"
          WP_CRON_URL="${API_BASE_URL}/wp-cron.php?doing_wp_cron=$(date +%s)"
          LAST_VERSION="unknown"
          LAST_SCHEMA="unknown"
          LAST_READY="false"
          LAST_UPDATER_AUTH="unknown"
          LAST_UPDATER_STATUS="unknown"
          LAST_UPDATER_TARGET="unknown"
          LAST_UPDATER_MESSAGE=""

          # The updater checks every two minutes. Health traffic also kicks its
          # non-blocking cron path, so six minutes allows extra time for a delayed host cron cycle.
          for attempt in $(seq 1 36); do
            curl --silent --show-error --location --max-time 20 \
              "$HEALTH_URL" -o "$RUNNER_TEMP/bluevpn-health.json" || true

            if [ -s "$RUNNER_TEMP/bluevpn-health.json" ]; then
              mapfile -t HEALTH_FIELDS < <(python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'bluevpn-health.json'
          try:
              d=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              print('invalid'); print('unknown'); print('false'); print('unknown'); print('unknown'); print('unknown'); print('invalid health json')
          else:
              db=d.get('database') or {}
              updater=d.get('github_updater') or {}
              us=updater.get('status') or {}
              print(str(d.get('version','unknown')))
              print(str(db.get('schema_version','unknown')))
              print(str(bool(db.get('ready',False))).lower())
              print(str(updater.get('authenticated','unknown')).lower())
              print(str(us.get('status','unknown')))
              print(str(us.get('target','unknown')))
              print(str(us.get('message','')).replace('\n',' ')[:500])
          PY
              )
              LAST_VERSION="${HEALTH_FIELDS[0]:-unknown}"
              LAST_SCHEMA="${HEALTH_FIELDS[1]:-unknown}"
              LAST_READY="${HEALTH_FIELDS[2]:-false}"
              LAST_UPDATER_AUTH="${HEALTH_FIELDS[3]:-unknown}"
              LAST_UPDATER_STATUS="${HEALTH_FIELDS[4]:-unknown}"
              LAST_UPDATER_TARGET="${HEALTH_FIELDS[5]:-unknown}"
              LAST_UPDATER_MESSAGE="${HEALTH_FIELDS[6]:-}"
            fi

            echo "WordPress convergence ${attempt}/36: version=${LAST_VERSION} schema=${LAST_SCHEMA} ready=${LAST_READY} updater_auth=${LAST_UPDATER_AUTH} updater_status=${LAST_UPDATER_STATUS} updater_target=${LAST_UPDATER_TARGET}"
            if [ -n "$LAST_UPDATER_MESSAGE" ]; then
              echo "WordPress updater message: $LAST_UPDATER_MESSAGE"
            fi
            if [ "$LAST_VERSION" = "$VERSION" ] && [ "$LAST_SCHEMA" = "$EXPECTED_SCHEMA" ] && [ "$LAST_READY" = "true" ]; then
              echo "WordPress control plane is synchronized with APK ${VERSION}."
              exit 0
            fi

            # Force cron processing as a fallback for hosts where loopback cron
            # spawning is delayed. This endpoint is standard WordPress cron.
            curl --silent --show-error --location --max-time 20 \
              "$WP_CRON_URL" -o /dev/null || true
            sleep 10
          done

          echo "::error::WORDPRESS_AUTOUPDATE_TIMEOUT expected=${VERSION} current=${LAST_VERSION} schema=${LAST_SCHEMA} ready=${LAST_READY} updater_auth=${LAST_UPDATER_AUTH} updater_status=${LAST_UPDATER_STATUS} updater_target=${LAST_UPDATER_TARGET}"
          if [ -n "$LAST_UPDATER_MESSAGE" ]; then
            echo "::error::WORDPRESS_UPDATER_MESSAGE ${LAST_UPDATER_MESSAGE}"
          fi
          if [ "$LAST_VERSION" = "4.0.24" ] || [ "$LAST_UPDATER_AUTH" = "unknown" ]; then
            echo "::error::WORDPRESS_BOOTSTRAP_REQUIRED The installed manager is too old to expose authenticated updater diagnostics. Install the published bluevpn-manager.zip once, then future releases can update automatically with the migrated GitHub token."
          fi
          exit 1

      - name: Mark Android runtime checkout stage
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_STAGE=checkout-android-runtime" >> "$GITHUB_ENV"
          echo "checkout-android-runtime" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"
          echo "WordPress release barrier passed; starting Android runtime checkout." | tee -a "$GITHUB_WORKSPACE/android-build.log"

      - name: Checkout official v2rayNG source
        uses: actions/checkout@v6
        with:
          repository: 2dust/v2rayNG
          ref: ${{ steps.config.outputs.upstream_ref }}
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Checkout pinned sing-box core
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.config.outputs.sing_box_ref }}
          path: sing-box-core
          fetch-depth: 1

      - name: Setup Go for sing-box
        uses: actions/setup-go@v6
        with:
          go-version-file: sing-box-core/go.mod
          cache-dependency-path: sing-box-core/go.sum

      - name: Setup Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          python - <<'PY'
          from pathlib import Path

          path = Path("upstream/V2rayNG/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          marker = "android {"

          if 'ndkVersion = "29.0.14206865"' not in text:
              if marker not in text:
                  raise SystemExit("android block not found")
              text = text.replace(
                  marker,
                  marker + '\n    ndkVersion = "29.0.14206865"',
                  1,
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Build libhevtun
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Fetch AndroidLibXrayLite release tag
        id: xray
        working-directory: upstream/AndroidLibXrayLite
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            --force \
            --prune \
            --tags \
            "+refs/tags/*:refs/tags/*"

          CURRENT_TAG="$(git tag --points-at HEAD | sort -V | tail -n 1)"
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG="$(git describe --tags --abbrev=0)"
          fi
          if [ -z "$CURRENT_TAG" ]; then
            echo "Could not determine AndroidLibXrayLite release tag."
            exit 1
          fi

          echo "AndroidLibXrayLite commit: $(git rev-parse --short HEAD)"
          echo "AndroidLibXrayLite tag: $CURRENT_TAG"
          echo "tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ steps.xray.outputs.tag }}
          fileName: libv2ray.aar
          out-file-path: upstream/V2rayNG/app/libs/

      - name: Build isolated sing-box Android runtime
        working-directory: sing-box-core
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_STAGE=sing-box-native-build" >> "$GITHUB_ENV"
          echo "sing-box-native-build" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"

          SINGBOX_LOG="$GITHUB_WORKSPACE/singbox-build.log"
          : > "$SINGBOX_LOG"
          exec > >(tee -a "$SINGBOX_LOG") 2>&1

          TAGS="$(tr '\n' ' ' < release/DEFAULT_BUILD_TAGS_OTHERS | xargs)"
          LDFLAGS="$(cat release/LDFLAGS) -s -w -buildid="
          ARM64_OUTPUT="$GITHUB_WORKSPACE/upstream/V2rayNG/app/libs/arm64-v8a/libbluevpn_singbox.so"
          ARMV7_OUTPUT="$GITHUB_WORKSPACE/upstream/V2rayNG/app/libs/armeabi-v7a/libbluevpn_singbox.so"

          mkdir -p "$(dirname "$ARM64_OUTPUT")" "$(dirname "$ARMV7_OUTPUT")"
          rm -f "$ARM64_OUTPUT" "$ARMV7_OUTPUT"

          # Go supports an internally linked Android/arm64 PIE without cgo.
          # Android/arm (armeabi-v7a) always requires external cgo linking and
          # has repeatedly failed before Gradle on GitHub runners. BlueVPN keeps
          # the 32-bit APK fully functional through its Xray safety fallback,
          # while sing-box is enabled on the modern arm64 runtime.
          env \
            CGO_ENABLED=0 \
            GOOS=android \
            GOARCH=arm64 \
            GOFLAGS= \
            go build -trimpath -buildvcs=false \
              -tags "$TAGS" -ldflags "$LDFLAGS" \
              -o "$ARM64_OUTPUT" \
              ./cmd/sing-box

          test -s "$ARM64_OUTPUT"
          file "$ARM64_OUTPUT"
          if ! file "$ARM64_OUTPUT" | grep -Eq 'ELF 64-bit.*ARM aarch64'; then
            echo "::error::The generated sing-box runtime is not Android arm64."
            exit 1
          fi

          echo "sing-box ${{ steps.config.outputs.sing_box_ref }} built for arm64-v8a."
          echo "armeabi-v7a intentionally uses the Xray fallback; no broken sing-box binary is packaged."

          # The native build is complete. Any later failure must not be
          # misreported as a sing-box failure.
          echo "BUILD_STAGE=prepare-android" >> "$GITHUB_ENV"
          echo "prepare-android" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"

      - name: Upload failed sing-box build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: BlueVPN-sing-box-build-log
          path: singbox-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Mark Android source preparation stage
        shell: bash
        run: |
          echo "BUILD_STAGE=prepare-android" >> "$GITHUB_ENV"
          echo "prepare-android" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install branding tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow

      - name: Apply BlueVPN custom UI and features
        shell: bash
        run: |
          set -o pipefail
          python scripts/prepare_android.py 2>&1 | tee "$GITHUB_WORKSPACE/prepare-android.log"

      - name: Apply BlueVPN login and registration redesign
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="android-source/BlueVpnSubscriptionsActivity.kt"
          TARGET="upstream/V2rayNG/app/src/main/java/com/v2ray/ang/ui/BlueVpnSubscriptionsActivity.kt"
          test -f "$SOURCE"
          test -d "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"
          grep -q 'ورود به حساب کاربری' "$TARGET"
          grep -q 'archiveOtpRow' "$TARGET"
          echo "BlueVPN native auth redesign applied to Android source."

      - name: BlueVPN stability completion regression gate
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_STAGE=release-regression-gate" >> "$GITHUB_ENV"
          echo "release-regression-gate" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"
          {
            python scripts/validate_generated_android.py
            python scripts/validate_stability_completion.py
            python scripts/validate_production_completion.py
            python scripts/validate_wordpress_connectivity_hotfix.py
            python scripts/validate_wordpress_release_autopilot.py
            python scripts/validate_release_race_fix.py
            python scripts/validate_authenticated_wordpress_updater.py
            python scripts/validate_exact_runtime_lifecycle.py
            while IFS= read -r -d '' file; do
              php -l "$file" >/dev/null
            done < <(find bluevpn-manager -type f -name '*.php' -print0)
            echo "BlueVPN release regression gate passed."
          } 2>&1 | tee "$GITHUB_WORKSPACE/stability-gate.log"

      - name: Upload failed Android source preparation log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: BlueVPN-prepare-android-log
          path: |
            prepare-android.log
            stability-gate.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist generated Android source snapshot in GitHub
        id: persist_generated
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.client_payload.ref || github.ref_name }}
          VERSION: ${{ steps.config.outputs.version }}
          VERSION_CODE: ${{ steps.config.outputs.version_code }}
        run: |
          set -euo pipefail
          echo "BUILD_STAGE=persist-generated-android-source" >> "$GITHUB_ENV"
          echo "persist-generated-android-source" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"

          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          app = Path("upstream/V2rayNG/app")
          snapshot = Path("android-source/generated")
          if snapshot.exists():
              shutil.rmtree(snapshot)

          required = [
              "src/main/java/com/v2ray/ang/ui/BlueVpnHomeActivity.kt",
              "src/main/java/com/v2ray/ang/ui/BlueVpnAiActivity.kt",
              "src/main/java/com/v2ray/ang/ui/BlueVpnServersActivity.kt",
              "src/main/java/com/v2ray/ang/ui/BlueVpnSubscriptionsActivity.kt",
              "src/main/java/com/v2ray/ang/ui/BlueVpnSettingsActivity.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnAccountManager.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnUpdateManager.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnLocationUtil.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnExperience.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnAi.kt",
              "src/main/res/drawable/bluevpn_screen_background.xml",
              "src/main/res/drawable/bluevpn_logo_background.xml",
              "src/main/res/drawable/bluevpn_connect_ring.xml",
              "src/main/res/drawable/bluevpn_status_dot.xml",
              "src/main/res/drawable/bluevpn_icon_chip.xml",
              "src/main/res/values/bluevpn_home_theme.xml",
              "src/main/res/values/bluevpn_ids.xml",
              "src/main/res/anim/bluevpn_fade_in.xml",
              "src/main/res/anim/bluevpn_fade_out.xml",
              "src/main/res/xml/bluevpn_update_paths.xml",
              "src/main/AndroidManifest.xml",
              "src/main/java/com/v2ray/ang/AngApplication.kt",
              "build.gradle.kts",
          ]
          optional = [
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnAdsCarouselView.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnTheme.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnLiveReporter.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnBootstrap.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnEngineManager.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnSingBoxProcess.kt",
              "src/main/java/com/v2ray/ang/ui/BlueVpnUpdateInstallActivity.kt",
              "src/main/java/com/v2ray/ang/bluevpn/BlueVpnUpdateFileProvider.kt",
              "src/main/res/drawable-night/bluevpn_screen_background.xml",
          ]

          hashes = {}
          for relative in required:
              source = app / relative
              if not source.exists():
                  raise SystemExit(f"Required generated Android file missing: {source}")
              destination = snapshot / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              hashes[relative] = hashlib.sha256(source.read_bytes()).hexdigest()

          missing_optional = []
          for relative in optional:
              source = app / relative
              if not source.exists():
                  missing_optional.append(relative)
                  continue
              destination = snapshot / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              hashes[relative] = hashlib.sha256(source.read_bytes()).hexdigest()

          if missing_optional:
              print("Optional generated files not present in this source revision:")
              for relative in missing_optional:
                  print(f"  - {relative}")

          manifest = {
              "app": "BlueVPN",
              "version": os.environ["VERSION"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "workflow_source_commit": os.environ["GITHUB_SHA"],
              "upstream_ref": json.loads(
                  Path("branding/app.json").read_text(encoding="utf-8")
              )["upstream_ref"],
              "files": hashes,
          }
          snapshot.mkdir(parents=True, exist_ok=True)
          (snapshot / "snapshot-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Prepared {len(hashes)} generated Android source files")
          PY

          git add android-source/generated
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist generated Android source for ${VERSION} [skip ci]"
          else
            echo "Generated Android source snapshot is already synchronized."
          fi

          PUSHED=0
          PUSH_LOG="$RUNNER_TEMP/bluevpn-generated-push.log"
          : > "$PUSH_LOG"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${TARGET_BRANCH}" --prune
            git rebase "origin/${TARGET_BRANCH}"
            if git push --porcelain origin "HEAD:${TARGET_BRANCH}" >"$PUSH_LOG" 2>&1; then
              cat "$PUSH_LOG"
              PUSHED=1
              break
            fi
            echo "Generated-source push retry ${attempt}/5; remote branch changed while this run was active."
            sleep $((attempt * 2))
          done

          if [ "$PUSHED" != "1" ]; then
            echo "::error::Generated Android source could not be persisted after five synchronized retries."
            sed 's/^/[git-push-final] /' "$PUSH_LOG" || true
            exit 1
          fi

          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_AFTER=""
          for attempt in 1 2 3 4 5 6 7 8; do
            REMOTE_AFTER="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            if [ "$REMOTE_AFTER" = "$LOCAL_SHA" ]; then
              break
            fi
            sleep 2
          done

          if [ "$REMOTE_AFTER" != "$LOCAL_SHA" ]; then
            echo "::error::Generated Android source was not verifiably persisted to GitHub. Local=$LOCAL_SHA Remote=$REMOTE_AFTER"
            exit 1
          fi

          echo "source_sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "repository_commit_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${LOCAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "Verified generated-source commit: $LOCAL_SHA"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: upstream/V2rayNG/**/*.gradle*

      - name: Validate generated Android manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path(
              "upstream/V2rayNG/app/src/main/AndroidManifest.xml"
          )
          text = path.read_text(encoding="utf-8")
          ET.parse(path)

          permission = (
              "android.permission.REQUEST_INSTALL_PACKAGES"
          )

          if text.count(permission) != 1:
              raise SystemExit(
                  "REQUEST_INSTALL_PACKAGES must exist exactly once"
              )

          xml_declaration = text.find("<?xml")
          manifest_opening = text.find("<manifest")
          permission_position = text.find(
              "android.permission.REQUEST_INSTALL_PACKAGES"
          )

          if not (
              xml_declaration >= 0
              and manifest_opening > xml_declaration
              and permission_position > manifest_opening
          ):
              raise SystemExit(
                  "Install permission is outside the manifest root"
              )

          print("AndroidManifest.xml validation passed")
          PY

      - name: Build unsigned release APKs
        working-directory: upstream/V2rayNG
        env:
          BUILD_STAGE: gradle-compile
        shell: bash
        run: |
          set -o pipefail
          echo "BUILD_STAGE=gradle-compile" >> "$GITHUB_ENV"
          echo "gradle-compile" > "$GITHUB_WORKSPACE/.bluevpn-build-stage"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          ./gradlew :app:assemblePlaystoreRelease \
            "-PABI_FILTERS=arm64-v8a;armeabi-v7a" \
            --stacktrace \
            --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Show Android compiler errors
        if: ${{ failure() && env.BUILD_STAGE == 'gradle-compile' }}
        shell: bash
        run: |
          set +e
          echo "========== Android build errors =========="
          if [ -f android-build.log ]; then
            grep -E -i               "e: |error:|unresolved reference|cannot access|compilation error|failed"               android-build.log               | tail -n 120               || tail -n 160 android-build.log
          else
            echo "android-build.log was not created."
          fi

      - name: Upload failed Android build log
        if: ${{ failure() && env.BUILD_STAGE == 'gradle-compile' }}
        uses: actions/upload-artifact@v6
        with:
          name: BlueVPN-android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Decode permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bluevpn-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/bluevpn-signing/BlueVPN-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/bluevpn-signing/BlueVPN-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

      - name: Align and sign APKs permanently
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          KEYSTORE="$RUNNER_TEMP/bluevpn-signing/BlueVPN-release.jks"
          mkdir -p dist "$RUNNER_TEMP/bluevpn-aligned"

          mapfile -t APKS < <(
            find upstream/V2rayNG/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No release APK was generated."
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            filename="$(basename "$apk")"

            # Normalize exactly one APK extension. Some Gradle outputs are
            # already named *.apk while older outputs end in -unsigned.apk.
            base_name="${filename%.apk}"
            base_name="${base_name%-unsigned}"
            base_name="${base_name%-release}"
            clean_name="${base_name}.apk"

            aligned="$RUNNER_TEMP/bluevpn-aligned/${base_name}-aligned.apk"
            signed="dist/$clean_name"

            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "$aligned"

            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$signed" \
              "$aligned"

            "$BUILD_TOOLS/apksigner" verify \
              --verbose \
              --print-certs \
              "$signed"

            echo "Signed: $signed"
          done

          echo "Generated signed APKs:"
          ls -lah dist

      - name: Create GitHub Release metadata and checksums
        env:
          VERSION: ${{ steps.config.outputs.version }}
          VERSION_CODE: ${{ steps.config.outputs.version_code }}
          BUILD_PUBLISHED_AT: ${{ github.event.head_commit.timestamp }}
          SOURCE_COMMIT: ${{ steps.persist_generated.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              Path("release.json").read_text(
                  encoding="utf-8"
              )
          )

          version = os.environ["VERSION"]
          version_code = int(os.environ["VERSION_CODE"])
          build_number = int(os.environ["GITHUB_RUN_NUMBER"])
          commit = os.environ.get("SOURCE_COMMIT") or os.environ["GITHUB_SHA"]

          apks = sorted(
              path.name
              for path in Path("dist").glob("*.apk")
          )

          description = str(
              release.get("description")
              or "نسخه جدید BlueVPN آماده است."
          )

          manifest = {
              "app_name": "BlueVPN",
              "version": version,
              "version_code": version_code,
              "build_number": build_number,
              "commit": commit,
              "published_at": os.environ.get(
                  "BUILD_PUBLISHED_AT",
                  "",
              ),
              "update_title": f"BlueVPN {version}",
              "update_message": description,
              "apk_assets": apks,
              "source": "github_actions",
          }

          Path("dist/release-manifest.json").write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          notes = (
              f"# BlueVPN {version}\n\n"
              f"{description}\n\n"
              f"- Build: #{build_number}\n"
              f"- Version Code: {version_code}\n"
              f"- Commit: `{commit[:8]}`\n"
              f"- Signed APKs: {len(apks)}\n"
          )

          Path("dist/RELEASE_NOTES.md").write_text(
              notes,
              encoding="utf-8",
          )
          PY

      - name: Upload signed BlueVPN APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: BlueVPN-${{ steps.config.outputs.version }}-signed
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.config.outputs.version }}
          SOURCE_COMMIT: ${{ steps.persist_generated.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then
            gh release delete "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          fi

          gh release create "$TAG" \
            dist/*.apk \
            dist/SHA256SUMS.txt \
            dist/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "BlueVPN ${VERSION}" \
            --notes-file dist/RELEASE_NOTES.md

          echo "GitHub Release published from persisted source: ${TAG} @ ${SOURCE_COMMIT}"

      - name: Sync Android release metadata to WordPress
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("branding/app.json").read_text(encoding="utf-8")).get("api_base_url", "").rstrip("/"))
          PY
          )"
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::api_base_url is empty; WordPress release sync skipped."
            exit 0
          fi
          SYNC_URL="${API_BASE_URL}/api/v1/mobile/config?refresh=true"
          echo "Refreshing WordPress app release metadata: ${SYNC_URL}"
          if ! curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 35 "$SYNC_URL" -o "$RUNNER_TEMP/bluevpn-wordpress-mobile-config.json"; then
            echo "::warning::WordPress immediate release sync failed; background polling will retry automatically."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data=json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("bluevpn-wordpress-mobile-config.json").read_text(encoding="utf-8"))
          print("WordPress latest_version:", data.get("latest_version"))
          print("WordPress update_source:", data.get("update_source"))
          PY

      # BlueVPN Manager is already published and verified by the release barrier
      # before Gradle starts. The dedicated bluevpn-manager-release.yml workflow
      # remains only as a manual/fallback reconciler.

      - name: Send signed APK files to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.config.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not configured; skipping Telegram delivery."
            exit 0
          fi

          SOURCE_COMMIT="${{ steps.persist_generated.outputs.source_sha }}"
          SOURCE_URL="${{ steps.persist_generated.outputs.repository_commit_url }}"

          curl --fail --show-error --silent \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚀 Build جدید BlueVPN آماده شد%0Aنسخه: ${VERSION}%0ABuild: #${GITHUB_RUN_NUMBER}%0ACommit سورس: ${SOURCE_COMMIT:0:8}%0Aفایل‌های پروژه و سورس تولیدشده روی GitHub تأیید شدند.%0A${SOURCE_URL}%0Aدو فایل مخصوص arm64-v8a و armeabi-v7a در ادامه ارسال می‌شوند."

          for apk in dist/*.apk; do
            ARCH="$(basename "$apk" .apk | sed -E 's/^BlueVPN_[^_]+_//')"
            CAPTION="$(printf '✅ APK جدید BlueVPN %s\n🏗 Build #%s\n📦 %s\n📱 معماری: %s\n🔐 امضای دائمی فعال است؛ بدون حذف نسخه قبلی نصب می‌شود.' \
              "$VERSION" "$GITHUB_RUN_NUMBER" "$(basename "$apk")" "$ARCH")"

            curl --fail --show-error --silent \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              --form "chat_id=${TELEGRAM_CHAT_ID}" \
              --form "document=@${apk}" \
              --form-string "caption=${CAPTION}"
          done
      - name: Send build failure and full log to Telegram
        if: ${{ failure() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.config.outputs.version }}
        shell: bash
        run: |
          set +e

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA="${GITHUB_SHA:0:8}"

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          stage_file = Path(".bluevpn-build-stage")
          stage = (
              stage_file.read_text(encoding="utf-8", errors="replace").strip()
              if stage_file.exists()
              else os.getenv("BUILD_STAGE", "pre-gradle")
          ) or "pre-gradle"
          candidates = []
          if stage == "sing-box-native-build":
              candidates.append(Path("singbox-build.log"))
          if stage == "prepare-android":
              candidates.append(Path("prepare-android.log"))
          elif stage == "release-regression-gate":
              candidates.append(Path("stability-gate.log"))
          elif stage == "gradle-compile":
              candidates.append(Path("android-build.log"))
          candidates.extend([
              Path("singbox-build.log"),
              Path("android-build.log"),
          ])
          log_path = next(
              (candidate for candidate in candidates if candidate.exists()),
              Path("android-build.log"),
          )
          report_path = Path("telegram-build-error.txt")

          header = [
              "❌ Build اپلیکیشن BlueVPN ناموفق بود",
              "",
              f"نسخه: {os.getenv('VERSION') or 'نامشخص'}",
              f"Build: #{os.getenv('GITHUB_RUN_NUMBER', 'نامشخص')}",
              f"Commit: {os.getenv('GITHUB_SHA', '')[:8]}",
              f"Branch: {os.getenv('GITHUB_REF_NAME', 'نامشخص')}",
              f"Actor: {os.getenv('GITHUB_ACTOR', 'نامشخص')}",
              f"Stage: {stage}",
              f"Log: {log_path.name}",
              f"Run: {os.getenv('GITHUB_SERVER_URL', '')}/"
              f"{os.getenv('GITHUB_REPOSITORY', '')}/actions/runs/"
              f"{os.getenv('GITHUB_RUN_ID', '')}",
              "",
              "خلاصه خطا:",
          ]

          if log_path.exists():
              raw = log_path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )
              lines = [
                  line.replace("\x00", "").rstrip()
                  for line in raw.splitlines()
              ]

              pattern = re.compile(
                  r"(^|\s)(e:|error:|fatal:)|::error::|"
                  r"WORDPRESS_[A-Z0-9_]+|"
                  r"unresolved reference|cannot access|"
                  r"compilation error|execution failed for task|"
                  r"what went wrong|build failed",
                  re.IGNORECASE,
              )
              matches = [line for line in lines if pattern.search(line)]

              # Remove repeated adjacent Gradle stack lines and keep the
              # most useful compiler messages near the end.
              compact = []
              seen = set()
              for line in matches:
                  normalized = line.strip()
                  if not normalized or normalized in seen:
                      continue
                  seen.add(normalized)
                  compact.append(normalized)

              selected = compact[-55:]
              if not selected:
                  selected = [
                      line for line in lines[-120:] if line.strip()
                  ]
          else:
              selected = [
                  f"هیچ فایل لاگی برای مرحله {stage} ساخته نشده است.",
                  "خطا پیش از ثبت خروجی ابزار Build رخ داده است.",
              ]

          report = "\n".join(header + selected)
          report_path.write_text(report + "\n", encoding="utf-8")

          # Telegram text messages are limited. Keep the readable summary
          # short; the complete log is sent as a document afterward.
          message = report
          if len(message) > 3700:
              message = (
                  "\n".join(header)
                  + "\n"
                  + "\n".join(selected[-28:])
              )
          if len(message) > 3900:
              message = message[:3850] + "\n… ادامه در فایل کامل لاگ"

          Path("telegram-build-message.txt").write_text(
              message,
              encoding="utf-8",
          )
          PY

          echo "========== Telegram failure report =========="
          cat telegram-build-error.txt
          cat telegram-build-error.txt >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not configured; failure report was not sent."
            exit 0
          fi

          MESSAGE="$(cat telegram-build-message.txt)"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 90 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"

          STAGE="$(cat .bluevpn-build-stage 2>/dev/null || printf '%s' "${BUILD_STAGE:-pre-gradle}")"
          if [ "$STAGE" = "prepare-android" ] && [ -f prepare-android.log ]; then
            LOG_FILE="prepare-android.log"
            LOG_CAPTION="📎 لاگ آماده‌سازی سورس Android | Build #${GITHUB_RUN_NUMBER} | ${SHORT_SHA}"
          elif [ "$STAGE" = "sing-box-native-build" ] && [ -f singbox-build.log ]; then
            LOG_FILE="singbox-build.log"
            LOG_CAPTION="📎 لاگ کامل ساخت sing-box | Build #${GITHUB_RUN_NUMBER} | ${SHORT_SHA}"
          elif [ -f android-build.log ]; then
            LOG_FILE="android-build.log"
            LOG_CAPTION="📎 لاگ کامل خطای Android | Build #${GITHUB_RUN_NUMBER} | ${SHORT_SHA}"
          else
            LOG_FILE="telegram-build-error.txt"
            LOG_CAPTION="📎 گزارش خطای BlueVPN | Build #${GITHUB_RUN_NUMBER} | ${SHORT_SHA}"
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 120 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${LOG_FILE}" \
            --form-string "caption=${LOG_CAPTION}"

          # Also send the compact report as a separate file so it is easy
          # to forward back for diagnosis.
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 90 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@telegram-build-error.txt" \
            --form-string "caption=🧾 خلاصه قابل ارسال خطای Build"
