name: BlueVPN Backup Self-Heal Repair

on:
  push:
    branches:
      - automation/backup-self-heal-5810

permissions:
  contents: write

jobs:
  build-validated-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Apply backup self-heal repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('bluevpn-manager/includes/class-bluevpn-production.php')
          s = p.read_text(encoding='utf-8')

          old = "    private const BACKUP_OPTION = 'bluevpn_manager_last_backup';\n    private const RESTORE_OPTION = 'bluevpn_manager_last_restore';\n"
          new = "    private const BACKUP_OPTION = 'bluevpn_manager_last_backup';\n    private const BACKUP_RECOVERY_OPTION = 'bluevpn_manager_backup_recovery_kick_at';\n    private const BACKUP_RECOVERY_STALE_AFTER = 108000; // 30 hours.\n    private const BACKUP_RECOVERY_THROTTLE = 21600; // 6 hours.\n    private const RESTORE_OPTION = 'bluevpn_manager_last_restore';\n"
          if old not in s: raise SystemExit('backup constants marker not found')
          s = s.replace(old, new, 1)

          old = "        self::ensure_native_control_plane();\n        self::ensure_schedule();\n    }\n\n    public static function activate(): void {\n        self::ensure_native_control_plane();\n        self::ensure_schedule();\n    }\n"
          new = "        self::ensure_native_control_plane();\n        self::ensure_schedule();\n        self::ensure_backup_recovery();\n    }\n\n    public static function activate(): void {\n        self::ensure_native_control_plane();\n        self::ensure_schedule();\n        self::ensure_backup_recovery();\n    }\n"
          if old not in s: raise SystemExit('init/activate marker not found')
          s = s.replace(old, new, 1)

          marker = "    public static function unschedule(): void {\n"
          helper = "    private static function ensure_backup_recovery(): void {\n        $last = self::backup_status();\n        $lastTs = !empty($last['created_at']) ? strtotime((string)$last['created_at']) : false;\n        $fresh = !empty($last['ok']) && $lastTs && $lastTs > time() - self::BACKUP_RECOVERY_STALE_AFTER;\n        if ($fresh) {\n            delete_option(self::BACKUP_RECOVERY_OPTION);\n            return;\n        }\n\n        $lastKick = (int)get_option(self::BACKUP_RECOVERY_OPTION, 0);\n        if ($lastKick > time() - self::BACKUP_RECOVERY_THROTTLE) return;\n\n        $next = wp_next_scheduled(self::BACKUP_HOOK);\n        if (!$next || $next > time() + 10 * MINUTE_IN_SECONDS) {\n            wp_schedule_single_event(time() + 60, self::BACKUP_HOOK);\n        }\n        update_option(self::BACKUP_RECOVERY_OPTION, time(), false);\n        BlueVPN_Utils::kick_wp_cron();\n    }\n\n"
          if marker not in s: raise SystemExit('unschedule marker not found')
          s = s.replace(marker, helper + marker, 1)

          old = "    public static function cron_backup(): void {\n        try { self::create_backup('scheduled'); }\n        catch (Throwable $e) {\n"
          new = "    public static function cron_backup(): void {\n        try {\n            self::create_backup('scheduled');\n            delete_option(self::BACKUP_RECOVERY_OPTION);\n        }\n        catch (Throwable $e) {\n"
          if old not in s: raise SystemExit('cron backup marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_current_release.py')
          ts = t.read_text(encoding='utf-8')
          marker = "    def test_98_missing_provider_repair_does_not_renew_entitlement(self):\n"
          regression = "    def test_backup_cron_self_heals_before_48_hour_health_warning(self):\n        production = text(\"bluevpn-manager/includes/class-bluevpn-production.php\")\n        self.assertIn(\"BACKUP_RECOVERY_STALE_AFTER = 108000\", production)\n        self.assertIn(\"BACKUP_RECOVERY_THROTTLE = 21600\", production)\n        self.assertIn(\"private static function ensure_backup_recovery\", production)\n        self.assertIn(\"wp_schedule_single_event(time() + 60, self::BACKUP_HOOK)\", production)\n        self.assertIn(\"BlueVPN_Utils::kick_wp_cron()\", production)\n        self.assertIn(\"self::ensure_backup_recovery();\", production)\n        self.assertIn(\"delete_option(self::BACKUP_RECOVERY_OPTION)\", production)\n\n"
          if 'test_backup_cron_self_heals_before_48_hour_health_warning' in ts:
              raise SystemExit('backup regression already present')
          if marker not in ts: raise SystemExit('test marker not found')
          t.write_text(ts.replace(marker, regression + marker, 1), encoding='utf-8')
          PY

      - name: Restore canonical health workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/project-health.yml

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          php -l bluevpn-manager/includes/class-bluevpn-production.php
          python scripts/sync_version.py --check
          python scripts/validate_bundle_integrity.py
          python scripts/validate_release.py
          python scripts/validate_php_release.py
          python -m unittest discover -s tests -p 'test_current_release.py'
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'bluevpn-release-bot'
          git config user.email 'bluevpn-release-bot@users.noreply.github.com'
          git add bluevpn-manager/includes/class-bluevpn-production.php tests/test_current_release.py .github/workflows/project-health.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No staged repair'; exit 1; }
          git commit -m 'fix(manager): self-heal stale backup cron [skip ci]'
          git push origin HEAD:automation/backup-self-heal-5810
