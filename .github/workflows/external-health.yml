name: BlueVPN External Health

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: bluevpn-external-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe public and database-backed health
        env:
          BLUEVPN_BASE_URLS: https://blluepanel.ir,https://bot.blluepanel.ir
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          bases=[value.strip().rstrip('/') for value in os.environ['BLUEVPN_BASE_URLS'].split(',') if value.strip()]
          urls=[base+path for base in bases for path in ('/health','/wp-json/bluevpn-system/v1/health')]
          errors=[]
          for url in urls:
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url, headers={'User-Agent':'BlueVPN-External-Health/5.1.4'})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          data=json.loads(r.read().decode('utf-8'))
                      if data.get('status')!='ok':
                          raise RuntimeError(f"health status is {data.get('status')!r}")
                      print(url, 'PASS', data.get('version','unknown'))
                      last=None
                      break
                  except Exception as e:
                      last=e
                      if attempt < 2: time.sleep(2**attempt)
              if last is not None: errors.append(f'{url}: {last}')
          if errors: raise SystemExit('\n'.join(errors))
          PY
