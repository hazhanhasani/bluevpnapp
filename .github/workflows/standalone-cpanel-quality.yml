name: Standalone cPanel PHP Quality
on:
  push:
    branches: [main, feature/standalone-cpanel-control-plane]
    paths:
      - 'bluevpn-standalone/**'
      - '.github/workflows/standalone-cpanel-quality.yml'
  pull_request:
    paths:
      - 'bluevpn-standalone/**'
      - '.github/workflows/standalone-cpanel-quality.yml'
permissions:
  contents: read
jobs:
  php-lint-and-contract:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bluevpn_tests
          MYSQL_USER: bluevpn
          MYSQL_PASSWORD: bluevpn_testing_only
          MYSQL_ROOT_PASSWORD: root_testing_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_testing_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Show runner PHP version
        run: php -v
      - name: Syntax check
        run: find bluevpn-standalone -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Contract assertions
        run: php bluevpn-standalone/tests/static_contracts.php
      - name: MySQL clean-install integration test
        env:
          BLUEVPN_TEST_DB_HOST: 127.0.0.1
          BLUEVPN_TEST_DB_NAME: bluevpn_tests
          BLUEVPN_TEST_DB_USER: bluevpn
          BLUEVPN_TEST_DB_PASSWORD: bluevpn_testing_only
        run: php bluevpn-standalone/tests/mysql_integration.php
      - name: Build cPanel native ZIP
        run: zip -qr bluevpn-cpanel-standalone.zip bluevpn-standalone -x '*/config.php' '*.sql' '*.log'
      - name: Upload independent cPanel installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bluevpn-cpanel-standalone
          path: bluevpn-cpanel-standalone.zip
          retention-days: 7
