name: Release BlueVPN Manager (manual recovery)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluevpn-manager-manual-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read and validate synchronized version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path('bluevpn-manager/bluevpn-manager.php').read_text(encoding='utf-8')
          m=re.search(r'(?mi)^\s*\*?\s*Version:\s*(\d+\.\d+\.\d+)\s*$',text)
          if not m: raise SystemExit('Plugin Version header not found')
          print(m.group(1))
          PY
          )"
          if ! [[ "$VERSION" =~ ^4\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid synchronized 4.x version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find bluevpn-manager -type f -name '*.php' -print0)
          rm -rf "$RUNNER_TEMP/bluevpn-manager-release"
          mkdir -p "$RUNNER_TEMP/bluevpn-manager-release/bluevpn-manager"
          rsync -a bluevpn-manager/ "$RUNNER_TEMP/bluevpn-manager-release/bluevpn-manager/"
          (cd "$RUNNER_TEMP/bluevpn-manager-release" && zip -qr "$GITHUB_WORKSPACE/bluevpn-manager.zip" bluevpn-manager)
          unzip -t bluevpn-manager.zip >/dev/null

      - name: Publish recovery release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="bluevpn-manager-v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" bluevpn-manager.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" bluevpn-manager.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "${GITHUB_SHA}" \
              --title "BlueVPN Manager ${VERSION}" \
              --notes "Manual recovery release for synchronized BlueVPN Manager ${VERSION}." \
              --latest=false
          fi
