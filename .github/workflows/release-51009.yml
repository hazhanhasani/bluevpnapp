name: BlueVPN Release 5.10.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-51009.yml'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Fix Windows Tapsell transition and sync 5.10.9
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          main = Path("bluevpn-windows/MainWindow.xaml.cs")
          s = main.read_text(encoding="utf-8")

          old = '''            // WebView must participate in layout while the provider script is
            // loading; a Collapsed WebView gives ad iframes a zero viewport.
            TapsellWebView.Visibility = Visibility.Visible;
            AdFallbackPanel.Visibility = Visibility.Collapsed;
            TapsellLoadingPanel.Visibility = Visibility.Visible;
'''
          new = '''            // Keep the WebView in layout while the provider loads so ad iframes
            // receive a real viewport, but do not expose the native white surface.
            // It becomes visible only after provider content is positively detected.
            TapsellWebView.Visibility = Visibility.Hidden;
            AdFallbackPanel.Visibility = Visibility.Collapsed;
            TapsellLoadingPanel.Visibility = Visibility.Visible;
'''
          if old not in s:
              raise SystemExit("Tapsell loading visibility block not found")
          s = s.replace(old, new, 1)

          old_wait = '''            if (!await WaitForTapsellContentAsync(_lifetimeCts.Token))
                return false;
            TapsellLoadingPanel.Visibility = Visibility.Collapsed;
            TapsellWebView.Visibility = Visibility.Visible;
'''
          new_wait = '''            if (!await WaitForTapsellContentAsync(_lifetimeCts.Token))
            {
                TapsellWebView.Visibility = Visibility.Collapsed;
                TapsellLoadingPanel.Visibility = Visibility.Collapsed;
                AdProviderLabel.Visibility = Visibility.Collapsed;
                return false;
            }
            TapsellLoadingPanel.Visibility = Visibility.Collapsed;
            TapsellWebView.Visibility = Visibility.Visible;
'''
          if old_wait not in s:
              raise SystemExit("Tapsell render gate block not found")
          s = s.replace(old_wait, new_wait, 1)
          main.write_text(s, encoding="utf-8")

          # Regression contract: loading WebView must stay hidden until real media renders.
          test = Path("tests/test_windows_theme_tapsell_render_576.py")
          t = test.read_text(encoding="utf-8")
          marker = '        self.assertIn("WaitForTapsellContentAsync", code)\n'
          if marker in t and 'Visibility.Hidden' not in t:
              t = t.replace(marker, marker + '        self.assertIn("TapsellWebView.Visibility = Visibility.Hidden", code)\n')
              test.write_text(t, encoding="utf-8")

          # Bump canonical contract first.
          version_file = Path("version.json")
          v = json.loads(version_file.read_text(encoding="utf-8"))
          v["version"] = "5.10.9"
          v["version_code"] = 51009
          v["components"] = {k:"5.10.9" for k in v.get("components", {})}
          version_file.write_text(json.dumps(v, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Synchronize all canonical runtime/package markers.
          subprocess.run(["python","scripts/sync_version.py"], check=True)

          # Keep historical/current textual release markers consistent too, while
          # deliberately never modifying workflow files from inside Actions.
          paths = subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")
          for raw in paths:
              if not raw or raw.startswith(".github/workflows/"):
                  continue
              p = Path(raw)
              try:
                  data = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = data.replace("5.10.8","5.10.9").replace("51008","51009")
              if updated != data:
                  p.write_text(updated, encoding="utf-8")
          PY

          python scripts/sync_version.py --check
          python scripts/validate_release.py
          python scripts/validate_windows.py
          python scripts/validate_php_release.py
          git diff --check

          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          git add -A ':!.github/workflows'
          git commit -m "release: BlueVPN 5.10.9 Windows Tapsell transition fix"
          git push origin HEAD:main

      - name: Dispatch coordinated 5.10.9 release
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "Releasing 5.10.9 from $SOURCE_SHA"

          gh workflow run bluevpn-manager-release.yml --repo "$GITHUB_REPOSITORY" --ref main             -f target_sha="$SOURCE_SHA"             -f request_id="version-5.10.9-${GITHUB_RUN_ID}"

          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches"             -f event_type='bluevpn_build'             -F 'client_payload[ref]'='main'             -F 'client_payload[target_sha]'="$SOURCE_SHA"             -F 'client_payload[build_mode]'='full'

          gh workflow run build-windows.yml --repo "$GITHUB_REPOSITORY" --ref main             -f target_sha="$SOURCE_SHA"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref main             -f target_sha="$SOURCE_SHA"
          gh workflow run bluevpn-site-theme-release.yml --repo "$GITHUB_REPOSITORY" --ref main             -f target_sha="$SOURCE_SHA"
