name: Standalone cPanel PHP Quality
on:
  push:
    branches: [main, feature/standalone-cpanel-control-plane]
    paths:
      - 'bluevpn-standalone/**'
      - '.github/workflows/standalone-cpanel-quality.yml'
  pull_request:
    paths:
      - 'bluevpn-standalone/**'
      - '.github/workflows/standalone-cpanel-quality.yml'
permissions:
  contents: read
jobs:
  php-lint-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Show runner PHP version
        run: php -v
      - name: Syntax check
        run: find bluevpn-standalone -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Contract assertions
        run: php bluevpn-standalone/tests/static_contracts.php
