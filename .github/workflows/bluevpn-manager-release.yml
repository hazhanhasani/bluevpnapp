name: Release BlueVPN Manager

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact source SHA/ref
        required: false
        default: main
      request_id:
        description: Correlation id
        required: false
        default: ''
  repository_dispatch:
    types: [bluevpn_manager_release]

permissions:
  contents: write

env:
  TARGET_SHA: ${{ github.event.client_payload.target_sha || inputs.target_sha || 'main' }}
  REQUEST_ID: ${{ github.event.client_payload.request_id || inputs.request_id || github.run_id }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested manager source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Read and validate BlueVPN Manager version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE "s/^ \* Version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p" bluevpn-manager/bluevpn-manager.php | head -1)"
          test -n "$VERSION"
          CONSTANT="$(sed -nE "s/^define\('BLUEVPN_MANAGER_VERSION', '([^']+)'\);/\1/p" bluevpn-manager/bluevpn-manager.php | head -1)"
          test "$VERSION" = "$CONSTANT"
          RELEASE_VERSION="$(python -c 'import json;print(json.load(open("release.json"))["version"])')"
          test "$VERSION" = "$RELEASE_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "request_id=${REQUEST_ID}" >> "$GITHUB_OUTPUT"
      - name: Lint and build installable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_php_release.py
          rm -rf build-manager bluevpn-manager.zip bluevpn-manager.zip.sha256
          mkdir -p build-manager/bluevpn-manager
          rsync -a --exclude='tests' --exclude='*.log' bluevpn-manager/ build-manager/bluevpn-manager/
          (cd build-manager && zip -qr ../bluevpn-manager.zip bluevpn-manager)
          unzip -t bluevpn-manager.zip >/dev/null
          sha256sum bluevpn-manager.zip > bluevpn-manager.zip.sha256
      - name: Publish or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="bluevpn-manager-v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" bluevpn-manager.zip bluevpn-manager.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "BlueVPN Manager ${VERSION}" --notes "Request: ${REQUEST_ID}" --latest=false
          else
            gh release create "$TAG" bluevpn-manager.zip bluevpn-manager.zip.sha256 --repo "$GITHUB_REPOSITORY" --title "BlueVPN Manager ${VERSION}" --notes "Request: ${REQUEST_ID}" --latest=false
          fi
      - name: Verify published updater contract
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-manager && mkdir verify-manager
          gh release download "bluevpn-manager-v${VERSION}" --repo "$GITHUB_REPOSITORY" --pattern bluevpn-manager.zip --dir verify-manager --clobber
          unzip -t verify-manager/bluevpn-manager.zip >/dev/null
          unzip -p verify-manager/bluevpn-manager.zip bluevpn-manager/bluevpn-manager.php | grep -F "Version: ${VERSION}" >/dev/null
      - name: Upload BlueVPN Manager build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: BlueVPN-Manager-${{ steps.meta.outputs.version }}-${{ env.REQUEST_ID }}
          path: |
            bluevpn-manager.zip
            bluevpn-manager.zip.sha256
          retention-days: 14
