name: BlueVPN One-Time Manager 5.10.7 Kick

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-manager-51007.yml'

permissions:
  contents: write
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch independent Manager 5.10.7 release
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run bluevpn-manager-release.yml --repo "$GITHUB_REPOSITORY" --ref main             -f target_sha="d6aa9394924af94ce7919c621a25d1f04e8bc150"             -f request_id="manual-repair-5.10.7-${GITHUB_RUN_ID}"

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          rm -f .github/workflows/kick-manager-51007.yml
          git add .github/workflows/kick-manager-51007.yml
          git commit -m "chore(ci): remove one-time Manager 5.10.7 kick [skip ci]"
          git push origin HEAD:main
