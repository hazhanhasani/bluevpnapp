name: BlueVPN Windows Tapsell Delivery Repair

on:
  push:
    branches:
      - automation/windows-tapsell-delivery-590

permissions:
  contents: write

jobs:
  build-validated-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/windows-tapsell-delivery-590
          fetch-depth: 2
      - name: Apply deterministic repair
        run: python scripts/_stage_windows_tapsell_repair.py
      - name: Remove staging helpers
        run: rm .github/workflows/stage-windows-tapsell-delivery.yml scripts/_stage_windows_tapsell_repair.py
      - name: Validate Windows
        run: python scripts/validate_windows.py
      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bluevpn-release-bot'
          git config user.email 'bluevpn-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(windows): make Tapsell delivery resilient [skip ci]'
          git push origin HEAD:automation/windows-tapsell-delivery-590
