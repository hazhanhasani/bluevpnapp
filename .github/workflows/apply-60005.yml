name: BlueVPN Apply 6.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-60005.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Bump canonical version contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("version.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["version"]="6.0.5"
          d["version_code"]=60005
          for key in list((d.get("components") or {}).keys()):
              d["components"][key]="6.0.5"
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python scripts/sync_version.py

      - name: Validate synchronized 6.0.5 source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_version.py --check
          python scripts/validate_release.py
          python scripts/validate_windows.py
          python scripts/validate_php_release.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit atomic 6.0.5 release bump
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          git add -A ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "release: bump BlueVPN to 6.0.5"
          git push origin HEAD:main
