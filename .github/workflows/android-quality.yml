name: Android Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-source/**'
      - 'android-test/**'
      - 'android-benchmark/**'
      - 'scripts/prepare_android.py'
      - '.github/workflows/android-quality.yml'

concurrency:
  group: bluevpn-android-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout BlueVPN
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools emulator'

      - name: Checkout pinned v2rayNG runtime
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REF="$(python - <<'PY'
          import json
          print(json.load(open('branding/app.json', encoding='utf-8'))['upstream_ref'])
          PY
          )"
          git clone --depth 1 --branch "$UPSTREAM_REF" https://github.com/2dust/v2rayNG.git upstream
          git -C upstream submodule update --init --recursive --depth 1
          test -f upstream/V2rayNG/gradlew

      - name: Resolve and download pinned libv2ray AAR
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(git -C upstream/AndroidLibXrayLite describe --tags --abbrev=0)"
          test -n "$TAG"
          mkdir -p upstream/V2rayNG/app/libs
          curl --fail --location --silent --show-error             --connect-timeout 20 --max-time 240 --retry 5 --retry-delay 3 --retry-all-errors             "https://github.com/2dust/AndroidLibXrayLite/releases/download/$TAG/libv2ray.aar"             -o upstream/V2rayNG/app/libs/libv2ray.aar
          test -s upstream/V2rayNG/app/libs/libv2ray.aar
          unzip -t upstream/V2rayNG/app/libs/libv2ray.aar >/dev/null

      - name: Prepare BlueVPN Android overlay
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/prepare_android.py

      - name: Run Android UI, state, screenshot and performance QA
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            cd upstream/V2rayNG
            chmod +x gradlew
            ./gradlew :app:connectedPlaystoreDebugAndroidTest -PABI_FILTERS=x86_64 --stacktrace --no-daemon --build-cache
            ./gradlew :benchmark:connectedBenchmarkAndroidTest -PABI_FILTERS=x86_64 --stacktrace --no-daemon --build-cache
            cd "$GITHUB_WORKSPACE"
            APP_ID="$(python - <<'PY'
            import json
            print(json.load(open('branding/app.json', encoding='utf-8'))['application_id'])
            PY
            )"
            mkdir -p reports/android-quality/qa
            adb pull "/sdcard/Android/data/$APP_ID/files/qa/." reports/android-quality/qa/ || true

      - name: Collect Android QA reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/android-quality
          cp -r upstream/V2rayNG/app/build/reports/androidTests reports/android-quality/app-androidTests 2>/dev/null || true
          cp -r upstream/V2rayNG/benchmark/build/reports/androidTests reports/android-quality/benchmark-androidTests 2>/dev/null || true
          find reports/android-quality -maxdepth 5 -type f -print | sort || true

      - name: Upload Android QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-quality-${{ github.sha }}
          path: reports/android-quality/
          if-no-files-found: warn
          retention-days: 14
