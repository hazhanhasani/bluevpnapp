name: Android Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-source/**'
      - 'android-test/**'
      - 'android-benchmark/**'
      - 'scripts/prepare_android.py'
      - '.github/workflows/android-quality.yml'

concurrency:
  group: bluevpn-android-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout BlueVPN
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools emulator'

      - name: Checkout pinned v2rayNG runtime
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REF="$(python - <<'PY'
          import json
          print(json.load(open('branding/app.json', encoding='utf-8'))['upstream_ref'])
          PY
          )"
          git clone --depth 1 --branch "$UPSTREAM_REF" https://github.com/2dust/v2rayNG.git upstream
          git -C upstream submodule update --init --recursive --depth 1
          test -f upstream/V2rayNG/gradlew

      - name: Resolve and download pinned libv2ray AAR
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(git -C upstream/AndroidLibXrayLite describe --tags --abbrev=0)"
          test -n "$TAG"
          mkdir -p upstream/V2rayNG/app/libs
          curl --fail --location --silent --show-error             --connect-timeout 20 --max-time 240 --retry 5 --retry-delay 3 --retry-all-errors             "https://github.com/2dust/AndroidLibXrayLite/releases/download/$TAG/libv2ray.aar"             -o upstream/V2rayNG/app/libs/libv2ray.aar
          test -s upstream/V2rayNG/app/libs/libv2ray.aar
          unzip -t upstream/V2rayNG/app/libs/libv2ray.aar >/dev/null

      - name: Prepare BlueVPN Android overlay
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/prepare_android.py

      - name: Preflight Android test and benchmark compilation
        working-directory: upstream/V2rayNG
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew             :app:assemblePlaystoreDebugAndroidTest             :benchmark:assembleBenchmark             -PABI_FILTERS=x86_64             --stacktrace --no-daemon --build-cache

      - name: Enable KVM acceleration for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chown "$USER":"$(id -gn)" /dev/kvm
            sudo chmod 660 /dev/kvm
            test -r /dev/kvm -a -w /dev/kvm
            echo "KVM hardware acceleration enabled."
          else
            echo "::warning::/dev/kvm is unavailable; emulator will use slow software acceleration."
          fi

      - name: Resolve Android QA application id
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          app=json.loads(Path('branding/app.json').read_text(encoding='utf-8'))
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              f.write('BLUEVPN_QA_APPLICATION_ID=' + app['application_id'] + '\n')
          PY

      - name: Run Android UI, state, screenshot and performance QA
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x upstream/V2rayNG/gradlew

            # Run UI instrumentation first and export its app-scoped screenshots
            # before the benchmark variant replaces the target package.
            upstream/V2rayNG/gradlew -p upstream/V2rayNG :app:connectedPlaystoreDebugAndroidTest -PABI_FILTERS=x86_64 --stacktrace --no-daemon --build-cache
            mkdir -p reports/android-quality/qa
            adb shell ls -la "/data/local/tmp/bluevpn-qa/"
            adb pull "/data/local/tmp/bluevpn-qa/." reports/android-quality/qa/

            # Macrobenchmark installs the benchmark target variant after screenshots
            # are safely copied off-device.
            upstream/V2rayNG/gradlew -p upstream/V2rayNG :benchmark:connectedBenchmarkAndroidTest -PABI_FILTERS=x86_64 --stacktrace --no-daemon --build-cache

      - name: Validate light and dark Locations screenshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          root=Path('reports/android-quality/qa')
          light=root/'locations-light-rtl.png'
          dark=root/'locations-dark-rtl.png'
          for path in (light,dark):
              if not path.is_file() or path.stat().st_size < 10_000:
                  raise SystemExit(f'missing or tiny QA screenshot: {path}')
          a=Image.open(light).convert('RGB')
          b=Image.open(dark).convert('RGB')
          if a.size != b.size or min(a.size) < 700:
              raise SystemExit(f'unexpected screenshot geometry: {a.size} vs {b.size}')
          for label,img in [('light',a),('dark',b)]:
              gray=img.convert('L')
              if ImageStat.Stat(gray).stddev[0] < 8:
                  raise SystemExit(f'{label} screenshot looks visually blank')
          if ImageChops.difference(a,b).getbbox() is None:
              raise SystemExit('light and dark screenshots are identical')
          print('Locations visual smoke gate: PASS', a.size)
          PY

      - name: Collect Android QA reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/android-quality
          cp -r upstream/V2rayNG/app/build/reports/androidTests reports/android-quality/app-androidTests 2>/dev/null || true
          cp -r upstream/V2rayNG/benchmark/build/reports/androidTests reports/android-quality/benchmark-androidTests 2>/dev/null || true
          find reports/android-quality -maxdepth 5 -type f -print | sort || true

      - name: Upload Android QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-quality-${{ github.sha }}
          path: reports/android-quality/
          if-no-files-found: warn
          retention-days: 14
