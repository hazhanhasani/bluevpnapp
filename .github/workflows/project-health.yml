name: BlueVPN Project Health

on:
  push:
    branches:
      - automation/version-bump-587

permissions:
  contents: write

concurrency:
  group: bluevpn-version-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-static-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Generate canonical BlueVPN 5.8.7 version tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          version = "5.8.7"
          version_code = 50807
          path = Path("version.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = version
          data["version_code"] = version_code
          for name in list((data.get("components") or {}).keys()):
              data["components"][name] = version
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          for test in Path("tests").glob("test_*.py"):
              text = test.read_text(encoding="utf-8")
              updated = text.replace("5.8.6", version).replace("50806", str(version_code))
              if updated != text:
                  test.write_text(updated, encoding="utf-8")
          PY
          python scripts/sync_version.py

      - name: Restore canonical health workflow before validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/project-health.yml > .github/workflows/project-health.yml

      - name: Install validation helpers
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: BlueVPN release validators
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_bundle_integrity.py
          python scripts/sync_version.py --check
          python scripts/validate_release.py
          python scripts/validate_windows.py
          python scripts/validate_php_release.py

      - name: Full Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit validated atomic tree to staging branch
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git diff --check
          git config user.name "BlueVPN Version Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::error::No version changes generated"; exit 1; }
          git commit -m "release: bump BlueVPN to 5.8.7 [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
