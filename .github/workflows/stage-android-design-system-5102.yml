name: Stage Android Design System 5.10.2

on:
  push:
    branches:
      - automation/android-design-system-5102

permissions:
  contents: write

jobs:
  validate-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Apply zero-asset design system
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          theme = Path('android-source/BlueVpnTheme.kt')
          text = theme.read_text(encoding='utf-8')
          if 'import android.graphics.Typeface' not in text:
              text = text.replace('import android.graphics.Color\n', 'import android.graphics.Color\nimport android.graphics.Typeface\n', 1)
          if 'object BlueVpnTypography' not in text:
              text += '''\n\n/** Zero-asset BlueVPN design tokens. Keep typography in the system font stack\n * so Persian glyphs stay native and no font binary increases APK/update size. */\nobject BlueVpnTypography {\n    const val micro = 8.5f\n    const val caption = 10f\n    const val bodySmall = 10.5f\n    const val body = 11.5f\n    const val label = 12.5f\n    const val titleSmall = 15f\n    const val title = 20f\n    const val hero = 22f\n    const val brand = 31f\n\n    private val scale = floatArrayOf(micro, caption, bodySmall, body, label, titleSmall, title, hero, brand)\n    private val regularFace: Typeface by lazy { Typeface.create("sans-serif", Typeface.NORMAL) }\n    private val mediumFace: Typeface by lazy { Typeface.create("sans-serif-medium", Typeface.NORMAL) }\n\n    fun resolve(requestedSp: Float): Float =\n        scale.minByOrNull { kotlin.math.abs(it - requestedSp) } ?: requestedSp\n\n    fun typeface(emphasized: Boolean): Typeface = if (emphasized) mediumFace else regularFace\n}\n\nobject BlueVpnSpacing {\n    const val xxs = 2\n    const val xs = 4\n    const val sm = 8\n    const val md = 12\n    const val lg = 16\n    const val pageHorizontal = 18\n    const val xl = 24\n}\n\nobject BlueVpnRadius {\n    const val small = 12\n    const val control = 16\n    const val card = 18\n    const val elevatedCard = 22\n    const val dialog = 24\n    const val large = 28\n    const val pill = 54\n\n    private val scale = intArrayOf(small, control, card, elevatedCard, dialog, large, pill)\n    fun resolve(requestedDp: Int): Int =\n        scale.minByOrNull { kotlin.math.abs(it - requestedDp) } ?: requestedDp\n}\n'''
          theme.write_text(text, encoding='utf-8')

          home = Path('android-source/BlueVpnHomeActivity.kt')
          text = home.read_text(encoding='utf-8')
          for anchor, addition in [
              ('import com.v2ray.ang.bluevpn.BlueVpnTheme\n', 'import com.v2ray.ang.bluevpn.BlueVpnTheme\nimport com.v2ray.ang.bluevpn.BlueVpnTypography\nimport com.v2ray.ang.bluevpn.BlueVpnSpacing\nimport com.v2ray.ang.bluevpn.BlueVpnRadius\n'),
          ]:
              if 'import com.v2ray.ang.bluevpn.BlueVpnTypography' not in text:
                  if anchor not in text:
                      raise SystemExit('theme import anchor missing')
                  text = text.replace(anchor, addition, 1)

          old = '''        text = value\n        textSize = sizeSp\n        setTextColor(color)\n        this.gravity = gravity\n        includeFontPadding = false\n        if (bold) typeface = Typeface.DEFAULT_BOLD\n'''
          new = '''        text = value\n        textSize = BlueVpnTypography.resolve(sizeSp)\n        setTextColor(color)\n        this.gravity = gravity\n        includeFontPadding = false\n        typeface = BlueVpnTypography.typeface(bold)\n        textDirection = View.TEXT_DIRECTION_FIRST_STRONG_RTL\n        textLocale = Locale("fa", "IR")\n        setLineSpacing(0f, 1.04f)\n'''
          if old not in text:
              raise SystemExit('uiText helper contract changed')
          text = text.replace(old, new, 1)

          text = text.replace('typeface = Typeface.DEFAULT_BOLD\n            gravity = Gravity.CENTER', 'typeface = BlueVpnTypography.typeface(true)\n            gravity = Gravity.CENTER', 1)
          text = text.replace('radius = dpHome(radiusDp).toFloat()', 'radius = dpHome(BlueVpnRadius.resolve(radiusDp)).toFloat()', 1)
          text = text.replace('cornerRadius = dpHome(radiusDp).toFloat()', 'cornerRadius = dpHome(BlueVpnRadius.resolve(radiusDp)).toFloat()', 1)
          text = text.replace('cornerRadius = dpHome(16)', 'cornerRadius = dpHome(BlueVpnRadius.control)', 1)

          page_padding = 'setPadding(dpHome(18), dpHome(8), dpHome(18), dpHome(14))'
          if page_padding in text:
              text = text.replace(page_padding, 'setPadding(dpHome(BlueVpnSpacing.pageHorizontal), dpHome(BlueVpnSpacing.sm), dpHome(BlueVpnSpacing.pageHorizontal), dpHome(14))', 1)

          home.write_text(text, encoding='utf-8')

          test = Path('tests/test_runtime_theme_github_fix_4169.py')
          t = test.read_text(encoding='utf-8')
          marker = "    def test_windows_workflow_uses_node24_ready_artifact_actions(self):\n"
          addition = '''    def test_android_design_system_is_zero_asset_and_applied_to_home(self):\n        theme = text("android-source/BlueVpnTheme.kt")\n        home = text("android-source/BlueVpnHomeActivity.kt")\n        self.assertIn("object BlueVpnTypography", theme)\n        self.assertIn("object BlueVpnSpacing", theme)\n        self.assertIn("object BlueVpnRadius", theme)\n        self.assertIn('Typeface.create("sans-serif-medium"', theme)\n        self.assertNotIn("Vazirmatn", theme)\n        self.assertIn("BlueVpnTypography.resolve(sizeSp)", home)\n        self.assertIn("BlueVpnTypography.typeface(bold)", home)\n        self.assertIn("TEXT_DIRECTION_FIRST_STRONG_RTL", home)\n        self.assertIn("BlueVpnRadius.resolve(radiusDp)", home)\n\n'''
          if 'test_android_design_system_is_zero_asset_and_applied_to_home' not in t:
              if marker not in t:
                  raise SystemExit('runtime theme test insertion point missing')
              t = t.replace(marker, addition + marker, 1)
          test.write_text(t, encoding='utf-8')
          PY

      - name: Version contract
        run: python scripts/sync_version.py --check

      - name: Targeted design regression
        run: python -m unittest tests.test_runtime_theme_github_fix_4169 -v

      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Freeze validated design files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name bluevpn-validation-bot
          git config user.email bluevpn-validation-bot@users.noreply.github.com
          git add android-source/BlueVpnTheme.kt android-source/BlueVpnHomeActivity.kt tests/test_runtime_theme_github_fix_4169.py
          git diff --cached --check
          git commit -m 'feat(android): introduce zero-asset design system [skip ci]'
          git push origin HEAD:automation/android-design-system-5102
