name: Android Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-source/**'
      - 'android-test/**'
      - 'android-benchmark/**'
      - 'scripts/prepare_android.py'
      - '.github/workflows/android-quality.yml'

concurrency:
  group: bluevpn-android-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout BlueVPN
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Checkout pinned v2rayNG runtime
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REF="$(python - <<'PY'
          import json
          print(json.load(open('branding/app.json', encoding='utf-8'))['upstream_ref'])
          PY
          )"
          git clone --depth 1 --branch "$UPSTREAM_REF" https://github.com/2dust/v2rayNG.git upstream
          git -C upstream submodule update --init --recursive --depth 1
          test -f upstream/V2rayNG/gradlew

      - name: Resolve and download pinned libv2ray AAR
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(git -C upstream/AndroidLibXrayLite describe --tags --abbrev=0)"
          test -n "$TAG"
          mkdir -p upstream/V2rayNG/app/libs
          curl --fail --location --silent --show-error             --connect-timeout 20 --max-time 240 --retry 5 --retry-delay 3 --retry-all-errors             "https://github.com/2dust/AndroidLibXrayLite/releases/download/$TAG/libv2ray.aar"             -o upstream/V2rayNG/app/libs/libv2ray.aar
          test -s upstream/V2rayNG/app/libs/libv2ray.aar
          unzip -t upstream/V2rayNG/app/libs/libv2ray.aar >/dev/null

      - name: Prepare BlueVPN Android overlay
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/prepare_android.py

      - name: Compile app instrumentation and Macrobenchmark sources
        working-directory: upstream/V2rayNG
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew             :app:compilePlaystoreDebugKotlin             :app:compilePlaystoreDebugAndroidTestKotlin             :benchmark:compileBenchmarkKotlin             -PABI_FILTERS=arm64-v8a             --stacktrace --no-daemon --build-cache --parallel
