name: BlueVPN Project Health

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bluevpn-project-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-static-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install validation helpers
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Reject merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git --exclude='*.log' .; then
            echo '::error::Merge conflict marker found in project source.'
            exit 1
          fi
      - name: PHP syntax — Manager and Theme
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null || { echo "::error file=$file::PHP syntax failed"; exit 1; }; done < <(find bluevpn-manager bluevpn-site -type f -name '*.php' -print0)
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: JavaScript syntax — Manager and Theme
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null || { echo "::error file=$file::JavaScript syntax failed"; exit 1; }; done < <(find bluevpn-manager bluevpn-site -type f -name '*.js' -print0)
      - name: JSON YAML XML and XAML syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys, yaml, xml.etree.ElementTree as ET
          errors=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              try:
                  if p.suffix.lower()=='.json': json.loads(p.read_text(encoding='utf-8'))
                  elif p.suffix.lower() in ('.yml','.yaml'): yaml.safe_load(p.read_text(encoding='utf-8'))
                  elif p.suffix.lower() in ('.xml','.xaml'): ET.parse(p)
              except Exception as e: errors.append(f'{p}: {e}')
          if errors:
              for e in errors[:100]: print(f'::error::{e}')
              sys.exit(1)
          PY
      - name: BlueVPN release validators
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_bundle_integrity.py
          python scripts/sync_version.py --check
          python scripts/validate_release.py
          python scripts/validate_windows.py
          python scripts/validate_php_release.py
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v


  release-fanout:
    name: Fan out coordinated version release
    needs: full-static-regression-gate
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    concurrency:
      group: bluevpn-version-fanout-main
      cancel-in-progress: false
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Detect pending or new BlueVPN release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(python -c 'import json;print(json.load(open("version.json"))["version"])')"
          PREVIOUS="$(git show HEAD^:version.json 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

          python - "$CURRENT" <<'PY'
          import re,sys
          v=sys.argv[1]
          m=re.fullmatch(r'(\d+)\.(\d+)\.(\d+)',v)
          if not m:
              raise SystemExit(f'invalid BlueVPN version: {v}')
          major,minor,patch=map(int,m.groups())
          if minor > 10 or patch > 10:
              raise SystemExit('BlueVPN minor/patch must remain within 0..10')
          PY

          VERSION_CHANGED=false
          if [ -n "$PREVIOUS" ] && [ "$CURRENT" != "$PREVIOUS" ]; then
            python - "$PREVIOUS" "$CURRENT" <<'PY'
          import re,sys
          def parse(v):
              m=re.fullmatch(r'(\d+)\.(\d+)\.(\d+)',v)
              if not m:
                  raise SystemExit(f'invalid BlueVPN version: {v}')
              return tuple(map(int,m.groups()))
          old,new=map(parse,sys.argv[1:3])
          if new <= old:
              raise SystemExit(f'BlueVPN version must increase: {old} -> {new}')
          PY
            VERSION_CHANGED=true
          fi

          RELEASE_PENDING=false
          for TAG in "v${CURRENT}" "bluevpn-manager-v${CURRENT}" "bluevpn-windows-v${CURRENT}" "bluevpn-site-v${CURRENT}"; do
            if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Pending release tag: ${TAG}"
              RELEASE_PENDING=true
            fi
          done

          RELEASE_REQUESTED=false
          FORCE_REBUILD=false
          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          if [ "$VERSION_CHANGED" = true ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [[ "$COMMIT_SUBJECT" == release:* ]]; then
            RELEASE_REQUESTED=true
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [[ "$COMMIT_SUBJECT" == release:* ]]; then
            FORCE_REBUILD=true
          fi

          SOURCE_SHA="${GITHUB_SHA}"
          if [ "$FORCE_REBUILD" = true ] && [ "$VERSION_CHANGED" = false ] && [ "$RELEASE_PENDING" = false ]; then
            git fetch --tags --force
            PINNED_SHA="$(git rev-list -n 1 "v${CURRENT}" 2>/dev/null || true)"
            if [ -n "$PINNED_SHA" ]; then
              SOURCE_SHA="$PINNED_SHA"
              echo "Forced rebuild will reuse pinned release source v${CURRENT}@${SOURCE_SHA}."
            fi
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "force_rebuild=$FORCE_REBUILD" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_REQUESTED" = true ] && { [ "$VERSION_CHANGED" = true ] || [ "$RELEASE_PENDING" = true ] || [ "$FORCE_REBUILD" = true ]; }; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Release requested: previous=${PREVIOUS:-none}, current=$CURRENT, version_changed=$VERSION_CHANGED, release_pending=$RELEASE_PENDING, force_rebuild=$FORCE_REBUILD, source_sha=$SOURCE_SHA, event=${GITHUB_EVENT_NAME}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "$RELEASE_PENDING" = true ]; then
              echo "BlueVPN $CURRENT still has pending release targets, but this commit is not a release trigger."
            else
              echo "Release already complete for BlueVPN $CURRENT"
            fi
          fi

      - name: Pin release tags to validated source SHA
        if: ${{ steps.version.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.current }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bluevpn-release-bot"
          git config user.email "bluevpn-release-bot@users.noreply.github.com"
          git fetch --tags --force

          for TAG in "v${VERSION}" "bluevpn-manager-v${VERSION}" "bluevpn-windows-v${VERSION}" "bluevpn-site-v${VERSION}"; do
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              EXISTING="$(git rev-list -n 1 "${TAG}")"
              if [ "$EXISTING" != "$SOURCE_SHA" ]; then
                echo "::error::Release tag ${TAG} already points to ${EXISTING}, expected ${SOURCE_SHA}."
                exit 1
              fi
              echo "Tag ${TAG} already pinned to validated source."
            else
              git tag "${TAG}" "$SOURCE_SHA"
              git push origin "refs/tags/${TAG}"
              echo "Pinned ${TAG} -> ${SOURCE_SHA}"
            fi
          done

      - name: Dispatch every BlueVPN release target at exact SHA
        if: ${{ steps.version.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          VERSION: ${{ steps.version.outputs.current }}
        shell: bash
        run: |
          set -euo pipefail
          echo "BlueVPN coordinated release: ${VERSION}@${SOURCE_SHA}"

          # Manager owns its plugin Release. Android waits for this Release and
          # for WordPress control-plane convergence before publishing v${VERSION}.
          gh workflow run bluevpn-manager-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f target_sha="$SOURCE_SHA" \
            -f request_id="version-${VERSION}-${GITHUB_RUN_ID}"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='bluevpn_build' \
            -F 'client_payload[ref]'='main' \
            -F 'client_payload[target_sha]'="$SOURCE_SHA" \
            -F 'client_payload[build_mode]'='full'

          # Every other platform consumes the exact same validated source SHA.
          gh workflow run build-windows.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f target_sha="$SOURCE_SHA"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f target_sha="$SOURCE_SHA"
          gh workflow run bluevpn-site-theme-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f target_sha="$SOURCE_SHA"

          echo "Dispatched Manager, Android, Windows, iOS and Site Theme for BlueVPN ${VERSION}."
