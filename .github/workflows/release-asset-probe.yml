name: BlueVPN Release Asset Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-asset-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Create release with asset exactly like production
        shell: bash
        run: |
          set -euo pipefail
          TAG="bluevpn-asset-probe-${GITHUB_RUN_ID}"
          printf 'probe\n' > probe.txt
          gh release create "$TAG" probe.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BlueVPN asset probe" --latest=false
          echo "ASSET_RELEASE_PROBE=PASS"
