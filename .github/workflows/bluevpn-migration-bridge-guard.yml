name: BlueVPN Migration Bridge Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/main.py'
      - 'server/wordpress_migration_bridge.py'
      - 'scripts/ensure_wordpress_migration_bridge.py'
      - '.github/bluevpn/wordpress_migration_bridge.py'
      - '.github/workflows/bluevpn-migration-bridge-guard.yml'

permissions:
  contents: write

concurrency:
  group: bluevpn-migration-bridge-guard-main
  cancel-in-progress: false

jobs:
  guard:
    # Avoid an unnecessary second repair run for our own guard commit.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[bridge-guard]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair bridge registration if needed
        run: python scripts/ensure_wordpress_migration_bridge.py

      - name: Validate Python syntax
        run: python -m py_compile server/main.py server/wordpress_migration_bridge.py scripts/ensure_wordpress_migration_bridge.py

      - name: Validate migration route contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'from .wordpress_migration_bridge import register_wordpress_migration_bridge' server/main.py
          test "$(grep -Fc 'register_wordpress_migration_bridge(app)' server/main.py)" -eq 1
          grep -Fq 'prefix="/internal/migration/v1"' server/wordpress_migration_bridge.py
          grep -Fq '@router.get("/health")' server/wordpress_migration_bridge.py
          grep -Fq '@router.get("/manifest")' server/wordpress_migration_bridge.py
          grep -Fq '@router.get("/export/{table_name}")' server/wordpress_migration_bridge.py

      - name: Commit repair only when required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server/main.py server/wordpress_migration_bridge.py; then
            echo 'Bridge already healthy; nothing to commit.'
            exit 0
          fi
          git config user.name 'BlueVPN Bridge Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add server/main.py server/wordpress_migration_bridge.py
          git commit -m 'chore: restore WordPress migration bridge [bridge-guard]'
          git push origin HEAD:main
