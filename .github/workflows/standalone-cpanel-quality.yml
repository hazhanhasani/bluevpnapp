name: Standalone cPanel PHP Quality
on:
  push:
    branches: [main, feature/standalone-cpanel-control-plane]
    paths:
      - 'bluevpn-standalone/**'
      - '.github/workflows/standalone-cpanel-quality.yml'
  pull_request:
    paths:
      - 'bluevpn-standalone/**'
      - '.github/workflows/standalone-cpanel-quality.yml'
permissions:
  contents: read
jobs:
  php-lint-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Show runner PHP version
        run: php -v
      - name: Syntax check
        run: find bluevpn-standalone -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Contract assertions
        run: php bluevpn-standalone/tests/static_contracts.php
      - name: Build cPanel staging ZIP
        run: zip -qr bluevpn-cpanel-staging.zip bluevpn-standalone -x '*/config.php' '*.sql' '*.log'
      - name: Upload staging installer bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bluevpn-cpanel-staging
          path: bluevpn-cpanel-staging.zip
          retention-days: 7
