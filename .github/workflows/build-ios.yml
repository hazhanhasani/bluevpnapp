name: Build BlueVPN iOS
on:
  workflow_dispatch:
    inputs:
      require_xray_runtime:
        description: Fail unless the signed BlueXrayCore XCFramework is present
        required: false
        default: false
        type: boolean
  push:
    paths: ['bluevpn-ios/**','branding/app.json','version.json','scripts/validate_ios.py','.github/workflows/build-ios.yml']
jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: python scripts/sync_version.py --check && python scripts/validate_ios.py && python scripts/validate_ios_runtime.py
      - name: Enforce production Xray runtime
        if: ${{ inputs.require_xray_runtime == true }}
        run: python scripts/validate_ios_runtime.py --require-embedded
      - run: brew install xcodegen && xcodegen generate --spec bluevpn-ios/project.yml
      - name: Compile unsigned simulator build
        run: xcodebuild -project bluevpn-ios/BlueVPN.xcodeproj -scheme BlueVPN -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
