name: Stage Android Connection V2

on:
  push:
    branches:
      - automation/android-connection-v2

permissions:
  contents: write

jobs:
  validate-and-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/android-connection-v2
          fetch-depth: 0

      - name: Apply Android Connection Engine v2 patch
        run: python scripts/stage_android_connection_v2.py

      - name: PHP syntax
        run: php -l bluevpn-manager/includes/class-bluevpn-api.php

      - name: BlueVPN release validators
        run: |
          set -euo pipefail
          python scripts/validate_bundle_integrity.py
          python scripts/sync_version.py --check
          python scripts/validate_release.py
          python scripts/validate_php_release.py

      - name: Targeted Android regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_dual_control_plane_581
          python -m unittest tests.test_stability_auto_recovery_517

      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Freeze validated production tree
        run: |
          set -euo pipefail
          rm -f scripts/stage_android_connection_v2.py .github/workflows/stage-android-connection-v2.yml
          git config user.name bluevpn-validation-bot
          git config user.email bluevpn-validation-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix(android): harden connection engine v2 [skip ci]'
          git push origin HEAD:automation/android-connection-v2
