name: Build BlueVPN Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'bluevpn-windows/**'
      - 'branding/app.json'
      - 'release.json'
      - 'scripts/validate_windows.py'
      - 'scripts/send_windows_telegram.ps1'
      - '.github/workflows/build-windows.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            xray_asset: Xray-windows-64.zip
          - arch: arm64
            rid: win-arm64
            xray_asset: Xray-windows-arm64-v8a.zip

    env:
      XRAY_VERSION: v26.7.28
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout BlueVPN
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate Windows release contracts
        shell: pwsh
        run: python scripts/validate_windows.py

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Compile Windows client
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Continue'
          "compile-$env:RID" | Set-Content .bluevpn-windows-stage
          & dotnet build bluevpn-windows/BlueVPN.Windows.csproj `
            -c Release `
            -p:EnableWindowsTargeting=true `
            -p:DebugType=None `
            -p:DebugSymbols=false 2>&1 | Tee-Object -FilePath windows-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      - name: Download and validate pinned official Xray runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          XRAY_ASSET: ${{ matrix.xray_asset }}
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          "xray-runtime-$env:RID" | Set-Content .bluevpn-windows-stage
          Start-Transcript -Path windows-xray-runtime.log -Force | Out-Null
          try {
            Remove-Item -Recurse -Force xray-download -ErrorAction SilentlyContinue
            New-Item -ItemType Directory xray-download | Out-Null
            Write-Host "Downloading official Xray $env:XRAY_VERSION asset $env:XRAY_ASSET for $env:RID"
            gh release download $env:XRAY_VERSION `
              --repo XTLS/Xray-core `
              --pattern $env:XRAY_ASSET `
              --dir xray-download
            if ($LASTEXITCODE -ne 0) { throw "gh release download failed with exit code $LASTEXITCODE" }

            $zip = Join-Path 'xray-download' $env:XRAY_ASSET
            if (-not (Test-Path $zip)) { throw "Pinned Xray asset was not downloaded: $env:XRAY_ASSET" }
            Expand-Archive -Path $zip -DestinationPath xray-download/runtime -Force

            $target = 'bluevpn-windows/runtime'
            New-Item -ItemType Directory $target -Force | Out-Null
            foreach ($name in @('xray.exe','wintun.dll','geoip.dat','geosite.dat')) {
              $source = Get-ChildItem -Path 'xray-download/runtime' -Recurse -File -Filter $name | Select-Object -First 1
              if (-not $source) { throw "Pinned Xray package is missing $name" }
              Copy-Item $source.FullName (Join-Path $target $name) -Force
            }

            function Get-PeMachine([string]$Path) {
              $stream = [System.IO.File]::OpenRead($Path)
              try {
                $reader = [System.IO.BinaryReader]::new($stream)
                $stream.Position = 0x3C
                $peOffset = $reader.ReadInt32()
                $stream.Position = $peOffset
                $signature = $reader.ReadUInt32()
                if ($signature -ne 0x00004550) { throw "Not a valid PE binary: $Path" }
                $machine = $reader.ReadUInt16()
                return ('0x{0:X4}' -f $machine)
              } finally {
                $stream.Dispose()
              }
            }

            $expectedMachine = if ($env:RID -eq 'win-arm64') { '0xAA64' } else { '0x8664' }
            foreach ($binary in @('xray.exe','wintun.dll')) {
              $binaryPath = Join-Path $target $binary
              $actualMachine = Get-PeMachine $binaryPath
              Write-Host "$binary PE machine: $actualMachine (expected $expectedMachine for $env:RID)"
              if ($actualMachine -ne $expectedMachine) {
                throw "$binary architecture mismatch: expected $expectedMachine for $env:RID, got $actualMachine"
              }
            }

            if ($env:RID -eq 'win-x64') {
              & (Join-Path $target 'xray.exe') version
              if ($LASTEXITCODE -ne 0) { throw "x64 Xray runtime self-check failed with exit code $LASTEXITCODE" }
            } else {
              Write-Host 'ARM64 Xray runtime validated by PE machine type; execution is intentionally skipped on the x64 GitHub runner.'
            }
          } catch {
            Write-Error $_
            throw
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Publish self-contained Windows client
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Continue'
          "publish-$env:RID" | Set-Content .bluevpn-windows-stage
          $version = (Get-Content release.json | ConvertFrom-Json).version
          $out = "dist/BlueVPN-Windows-$env:RID"
          & dotnet publish bluevpn-windows/BlueVPN.Windows.csproj `
            -c Release `
            -r $env:RID `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $out 2>&1 | Tee-Object -FilePath windows-publish.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

          Copy-Item README.md $out/README-BlueVPN.txt -Force
          Copy-Item NOTICE.md $out/NOTICE.txt -Force
          Copy-Item bluevpn-windows/README.md $out/README-Windows.txt -Force
          "BlueVPN $version | $env:RID | Xray $env:XRAY_VERSION" | Set-Content "$out/BUILD.txt"

      - name: Verify publish payload
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          "verify-$env:RID" | Set-Content .bluevpn-windows-stage
          $out = "dist/BlueVPN-Windows-$env:RID"
          foreach ($file in @(
            'BlueVPN.exe',
            'appsettings.json',
            'runtime/xray.exe',
            'runtime/wintun.dll',
            'runtime/geoip.dat',
            'runtime/geosite.dat'
          )) {
            if (-not (Test-Path (Join-Path $out $file))) { throw "Missing published file: $file" }
          }

      - name: Package Windows ZIP
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          "package-$env:RID" | Set-Content .bluevpn-windows-stage
          $version = (Get-Content release.json | ConvertFrom-Json).version
          $source = "dist/BlueVPN-Windows-$env:RID"
          $zip = "dist/BlueVPN-Windows-$version-$env:RID.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = Get-FileHash $zip -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($zip))" | Set-Content "$zip.sha256"
          Get-Item $zip | Format-List Name,Length,FullName
          $hash | Format-List

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueVPN-Windows-${{ matrix.rid }}
          path: |
            dist/BlueVPN-Windows-*.zip
            dist/BlueVPN-Windows-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Send Windows package to Telegram
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          "telegram-$env:RID" | Set-Content .bluevpn-windows-stage
          $version = (Get-Content release.json | ConvertFrom-Json).version
          $zip = Get-ChildItem -Path dist -File -Filter "BlueVPN-Windows-$version-$env:RID.zip" | Select-Object -First 1
          if (-not $zip) { throw "Windows package not found for Telegram: $env:RID" }
          & ./scripts/send_windows_telegram.ps1 `
            -Package $zip.FullName `
            -Version $version `
            -Rid $env:RID `
            -Architecture $env:ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Send Windows build failure to Telegram
        if: ${{ failure() }}
        continue-on-error: true
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ([string]::IsNullOrWhiteSpace([string]$env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrWhiteSpace([string]$env:TELEGRAM_CHAT_ID)) {
            Write-Host 'Telegram secrets are not configured; skipping Windows failure delivery.'
            exit 0
          }

          $version = try { (Get-Content release.json | ConvertFrom-Json).version } catch { 'unknown' }
          $stage = if (Test-Path .bluevpn-windows-stage) { (Get-Content .bluevpn-windows-stage -Raw).Trim() } else { 'unknown' }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $shortSha = if ([string]::IsNullOrWhiteSpace([string]$env:GITHUB_SHA)) { 'unknown' } else { $env:GITHUB_SHA.Substring(0, [Math]::Min(8, $env:GITHUB_SHA.Length)) }
          $message = "❌ Build ویندوز BlueVPN ناموفق بود`nنسخه: $version`nBuild: #$env:GITHUB_RUN_NUMBER`nمعماری: $env:RID`nمرحله: $stage`nCommit: $shortSha`n$runUrl"

          & curl.exe --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 `
            --request POST "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
            --data-urlencode "chat_id=$env:TELEGRAM_CHAT_ID" `
            --data-urlencode "text=$message" `
            --data-urlencode 'disable_web_page_preview=true'

          $log = if ($stage -like 'xray-runtime-*' -and (Test-Path windows-xray-runtime.log)) {
            'windows-xray-runtime.log'
          } elseif ($stage -like 'publish-*' -and (Test-Path windows-publish.log)) {
            'windows-publish.log'
          } elseif (Test-Path windows-build.log) {
            'windows-build.log'
          } elseif (Test-Path windows-xray-runtime.log) {
            'windows-xray-runtime.log'
          } else {
            $null
          }
          if ($log) {
            & curl.exe --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 180 `
              --request POST "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendDocument" `
              --form "chat_id=$env:TELEGRAM_CHAT_ID" `
              --form "document=@$log" `
              --form-string "caption=📎 لاگ Build ویندوز BlueVPN | $env:RID | Build #$env:GITHUB_RUN_NUMBER"
          }
