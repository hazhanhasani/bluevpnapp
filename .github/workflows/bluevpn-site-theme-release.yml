name: Release BlueVPN Site Theme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bluevpn-site/**'
      - 'branding/app.json'
      - 'release.json'
      - 'bluevpn-manager/bluevpn-manager.php'
      - '.github/workflows/bluevpn-site-theme-release.yml'

permissions:
  contents: write

jobs:
  release-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - name: Read and validate theme version
        id: theme
        shell: bash
        run: |
          set -euo pipefail
          THEME_VERSION="$(sed -nE 's/^Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' bluevpn-site/style.css | head -1)"
          RELEASE_VERSION="$(python -c 'import json;print(json.load(open("release.json"))["version"])')"
          BRAND_VERSION="$(python -c 'import json;print(json.load(open("branding/app.json"))["version_name"])')"
          MANAGER_VERSION="$(sed -nE "s/^define\('BLUEVPN_MANAGER_VERSION', '([^']+)'\);/\1/p" bluevpn-manager/bluevpn-manager.php | head -1)"
          SITE_VERSION="$(sed -nE "s/^define\('BLUEVPN_SITE_VERSION', '([^']+)'\);/\1/p" bluevpn-site/functions.php | head -1)"
          if [ "$THEME_VERSION" != "$RELEASE_VERSION" ] || [ "$THEME_VERSION" != "$BRAND_VERSION" ] || [ "$THEME_VERSION" != "$MANAGER_VERSION" ] || [ "$THEME_VERSION" != "$SITE_VERSION" ]; then
            echo "::error::BlueVPN component version mismatch theme=$THEME_VERSION release=$RELEASE_VERSION brand=$BRAND_VERSION manager=$MANAGER_VERSION site=$SITE_VERSION"
            exit 1
          fi
          python - "$THEME_VERSION" <<'PY'
          import re,sys
          m=re.fullmatch(r'(\d+)\.(\d+)\.(\d+)',sys.argv[1]); assert m
          _,minor,patch=map(int,m.groups())
          if minor>10 or patch>10: raise SystemExit('patch must stay within x.y.0..x.y.10')
          PY
          echo "version=$THEME_VERSION" >> "$GITHUB_OUTPUT"
      - name: Enforce theme version bump on source changes
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --name-only HEAD^ HEAD -- bluevpn-site/ | grep -q .; then
            OLD="$(git show HEAD^:bluevpn-site/style.css 2>/dev/null | sed -nE 's/^Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' | head -1 || true)"
            NEW="${{ steps.theme.outputs.version }}"
            if [ -n "$OLD" ] && [ "$OLD" = "$NEW" ]; then
              echo '::error::bluevpn-site changed without a theme version bump'
              exit 1
            fi
          fi
          echo 'BlueVPN theme patch must stay within x.y.0..x.y.10'
      - name: Lint theme PHP and build installable ZIP
        env:
          THEME_VERSION: ${{ steps.theme.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find bluevpn-site -type f -name '*.php' -print0)
          rm -rf build-theme && mkdir -p build-theme/bluevpn-site
          rsync -a bluevpn-site/ build-theme/bluevpn-site/
          (cd build-theme && zip -qr "../bluevpn-site-theme-v${THEME_VERSION}.zip" bluevpn-site)
          unzip -t "bluevpn-site-theme-v${THEME_VERSION}.zip" >/dev/null
      - name: Publish or refresh GitHub theme release
        env:
          GH_TOKEN: ${{ secrets.BLUEVPN_GITHUB_RELEASE_TOKEN || github.token }}
          THEME_VERSION: ${{ steps.theme.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="bluevpn-site-v${THEME_VERSION}"
          ASSET="bluevpn-site-theme-v${THEME_VERSION}.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BlueVPN Site ${THEME_VERSION}" --latest=false
          fi
      - name: Verify published theme updater contract
        env:
          GH_TOKEN: ${{ secrets.BLUEVPN_GITHUB_RELEASE_TOKEN || github.token }}
          THEME_VERSION: ${{ steps.theme.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-theme && mkdir verify-theme
          gh release download "bluevpn-site-v${THEME_VERSION}" --repo "$GITHUB_REPOSITORY" --pattern "bluevpn-site-theme-v${THEME_VERSION}.zip" --dir verify-theme --clobber
          unzip -t "verify-theme/bluevpn-site-theme-v${THEME_VERSION}.zip" >/dev/null
      - name: Upload theme build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: BlueVPN-Site-${{ steps.theme.outputs.version }}
          path: bluevpn-site-theme-v${{ steps.theme.outputs.version }}.zip
          retention-days: 14
