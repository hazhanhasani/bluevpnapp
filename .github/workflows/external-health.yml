name: BlueVPN External Health

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluevpn-external-health
  cancel-in-progress: true

jobs:
  wordpress-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Probe public site, REST and database-backed health
        shell: bash
        run: |
          python - <<'PY'
          import json, sys, urllib.request
          cfg=json.load(open('branding/app.json',encoding='utf-8'))
          base=str(cfg.get('api_base_url') or cfg.get('website_url') or '').rstrip('/')
          if not base: raise SystemExit('Missing api_base_url')
          checks=[
              ('compat-health', base+'/health', True),
              ('rest-health', base+'/wp-json/bluevpn-system/v1/health', True),
              ('site-root', base+'/', False),
          ]
          failures=[]
          for name,url,expect_json in checks:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BlueVPN-External-Health/4.17.10','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      status=r.status; body=r.read(256*1024)
                  if status < 200 or status >= 400: raise RuntimeError(f'HTTP {status}')
                  if expect_json:
                      data=json.loads(body.decode('utf-8','replace'))
                      if data.get('status')!='ok': raise RuntimeError(f"health={data.get('status')} version={data.get('version')}")
                  print(f'OK {name}: {status}')
              except Exception as e:
                  failures.append(f'{name} {url}: {e}')
          if failures:
              for f in failures: print('::error::'+f)
              sys.exit(1)
          PY
