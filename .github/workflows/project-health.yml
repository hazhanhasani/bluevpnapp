name: BlueVPN Project Health

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bluevpn-project-health-${{ github.ref }}
  # Every main update owns a fan-out. Do not cancel an older update before it
  # has had a chance to start all of its build/release workflows.
  cancel-in-progress: false

jobs:
  full-static-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install validation helpers
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Reject merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git --exclude='*.log' .; then
            echo '::error::Merge conflict marker found in project source.'
            exit 1
          fi
      - name: PHP syntax — Manager and Theme
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null || { echo "::error file=$file::PHP syntax failed"; exit 1; }; done < <(find bluevpn-manager bluevpn-site -type f -name '*.php' -print0)
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: JavaScript syntax — Manager and Theme
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null || { echo "::error file=$file::JavaScript syntax failed"; exit 1; }; done < <(find bluevpn-manager bluevpn-site -type f -name '*.js' -print0)
      - name: JSON YAML XML and XAML syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys, yaml, xml.etree.ElementTree as ET
          errors=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              try:
                  if p.suffix.lower()=='.json': json.loads(p.read_text(encoding='utf-8'))
                  elif p.suffix.lower() in ('.yml','.yaml'): yaml.safe_load(p.read_text(encoding='utf-8'))
                  elif p.suffix.lower() in ('.xml','.xaml'): ET.parse(p)
              except Exception as e: errors.append(f'{p}: {e}')
          if errors:
              for e in errors[:100]: print(f'::error::{e}')
              sys.exit(1)
          PY
      - name: BlueVPN release validators
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_bundle_integrity.py
          python scripts/sync_version.py --check
          python scripts/validate_release.py
          python scripts/validate_windows.py
          python scripts/validate_php_release.py
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  fanout-main-builds:
    name: Start every BlueVPN workflow
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch all build, release and external-health workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Fan-out source: ${TARGET_REF}@${TARGET_SHA}"

          # Android build starts on every main update. Full Android publication
          # remains a separate release decision; version is source-authoritative.
          gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF" -f build_mode=fast

          # Platform build pipelines.
          gh workflow run build-windows.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF"

          # WordPress Manager and site/theme release pipelines. Manager receives
          # the exact source SHA so its updater artifact is tied to this update.
          gh workflow run bluevpn-manager-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF" \
            -f target_sha="$TARGET_SHA" -f request_id="main-push-${GITHUB_RUN_ID}"
          gh workflow run bluevpn-site-theme-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF"

          # Re-probe production on every main update as well.
          gh workflow run external-health.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF"

          echo 'All BlueVPN build/release workflows dispatched.'
